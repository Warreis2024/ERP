function dosyaEkle(f, files){
  const rows=ui.form.coklu[f.uid]||(ui.form.coklu[f.uid]=[]);
  const sinir=1500000;
  if(bulutHazir()){ [...files].forEach(file=>driveYukle(f, rows, file, S.firma.depo)); renderDrawer(); return; }
  [...files].forEach(file=>{
    const r={...bosSatir(f), dosya:file.name, boyut:file.size, tip:file.type||'', rev:'A', onem:'genel', onay:'bekliyor', yukleyen:ui.uid, tarih:bugun(), depo:'yerel'};
    if(S.firma.depo==='nas'){
      if(agIcinde()){ r.depo='nas'; r.yol=nasYol(r); }
      else if(nasAyar().disaridan==='engel'){ toast(file.name+': dosyalar yalnız şirket ağından yüklenebilir (NAS)'); return; }
      else { r.nasBekle=true; toast(file.name+': şirket dışındasın; dosya sunucuda bekler, ağa girildiğinde NAS\'a aktarılır'); }
    }
    rows.push(r);
    if(file.size>sinir && r.depo==='nas'){ toast(file.name+': NAS\'a doğrudan yazılır (şablonda içerik saklanmaz)'); return; }
    if(file.size>sinir&&API.acik){ rows.pop(); toast(file.name+': '+boyutYaz(file.size)+'. Sunucuya en fazla 1,5 MB dosya yüklenebilir'+(S.firma.depo==='gdrive'||S.firma.depo==='onedrive'?'; '+DEPO[S.firma.depo]+' bağlı olmadığı (ya da dosya izni verilmediği) için oraya da gönderilemedi. Ayarlar → Firma → Bulut depolar.':'. Büyük dosyalar için Ayarlar → Firma\'dan Google Drive bağla.')); return; }
    if(file.size>sinir){
      r.depo=S.firma.depo!=='yerel'?S.firma.depo:'gdrive';
      toast(file.name+': büyük dosya. '+DEPO[r.depo]+' bağlantısını düzenle panelinden ekle; sunucu aşamasında otomatik yüklenecek.');
      ui.dokDuz=f.uid+':'+(rows.length-1);
      return;
    }
    const oku=new FileReader();
    oku.onload=()=>{ r.url=String(oku.result); renderDrawer(); };
    oku.onerror=()=>toast(file.name+' okunamadı');
    oku.readAsDataURL(file);
  });
  renderDrawer();
}
// Google Drive'a parça parça yükleme (sunucu üzerinden, her parça 3,75 MB). Klasör: NetERP/<proje kodu>.
async function driveYukle(f, rows, file, depo){
  depo=depo||'gdrive'; const dad=DEPO[depo]||depo;
  const r={...bosSatir(f), dosya:file.name, boyut:file.size, tip:file.type||'', rev:'A', onem:'genel', onay:'bekliyor', yukleyen:ui.uid, tarih:bugun(), depo, yukleniyor:true, ilerleme:0};
  rows.push(r);
  const pid=ui.form.tur==='proje'?ui.form.id:ui.form.projeId, mid=ui.form.tur==='proje'?(S.moduller.find(m=>m.tur==='proje')||{}).id:ui.form.modulId;
  const ciz=()=>{ const el=document.querySelector(`[data-yuk="${r.id}"]`); if(el) el.textContent=dad+' yükleniyor · %'+r.ilerleme; else renderDrawer(); };
  try{
    const o=await apiIstek('/dosya/yukle/basla',{method:'POST', govde:{depo, ad:file.name, tip:file.type||'', boyut:file.size, projeId:pid||null, modulId:mid||null}});
    let bas=0, sonuc=o.dosya||null;
    if(!sonuc) do{
      const parca=file.slice(bas, Math.min(bas+o.parca, file.size));
      const yanit=await fetch('/api/dosya/yukle/parca?bas='+bas,{method:'POST', credentials:'same-origin', headers:{'content-type':'application/octet-stream','x-csrf-token':csrfOku(),'x-yukleme-oturum':o.oturum}, body:parca});
      const j=await yanit.json().catch(()=>({}));
      if(!yanit.ok) throw new Error(j.hata||('Yükleme hatası ('+yanit.status+')'));
      if(j.bitti){ sonuc=j.dosya; break; }
      bas=j.alinan||bas+parca.size; r.ilerleme=Math.min(99, Math.round(bas/Math.max(1,file.size)*100)); ciz();
    } while(bas<file.size || file.size===0);
    if(!sonuc) throw new Error('Yükleme tamamlanmadı');
    Object.assign(r,{url:sonuc.url, dosyaId:sonuc.id, klasor:o.klasor, boyut:sonuc.boyut||file.size}); delete r.yukleniyor; delete r.ilerleme;
    toast(file.name+' → '+dad+' / '+o.klasor+(depo==='gdrive'&&!sonuc.paylasildi?' (alan içi paylaşım yapılamadı; yalnız bağlı hesap görebilir)':''));
  }catch(e){
    const i=rows.indexOf(r); if(i>=0) rows.splice(i,1);
    toast(file.name+': '+e.message);
  }
  if(ui.form) renderDrawer();
}
function dokIndir(r){
  if(r&&r.depo==='nas'&&!agIcinde()) return toast('Bu dosya şirket ağındaki NAS\'ta. Ofisten ya da VPN ile açılır: '+(r.yol||''));
  if(!r||!r.url) return toast('Dosya içeriği bu tarayıcıda yok');
  if(!r.url.startsWith('data:')){ window.open(r.url,'_blank','noopener'); return; }
  const a=document.createElement('a'); a.href=r.url; a.download=r.dosya||'dosya'; a.click();
}
function dokPaylas(r){
  if(r&&r.url&&!r.url.startsWith('data:')){
    (navigator.clipboard?navigator.clipboard.writeText(r.url):Promise.reject()).then(()=>toast('Paylaşım bağlantısı kopyalandı')).catch(()=>prompt('Paylaşım bağlantısı',r.url));
    return;
  }
  toast('Sunucudaki dosya için paylaşım bağlantısı sunucu aşamasında üretilir. Şimdilik Drive/OneDrive bağlantısı ekleyebilirsin.');
}

function sayiOku(v){
  let t=String(v??'').trim().replace(/\s/g,'');
  if(!t) return 0;
  if(t.includes(',')) t=t.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(t)) t=t.replace(/\./g,'');
  const n=Number(t);
  return Number.isFinite(n)?n:0;
}
function maliSatirTutar(r){
  const tutar=sayiOku(r.tutar);
  if(String(r.adet??'').trim()==='') return tutar;
  return sayiOku(r.adet)*tutar;
}
function paraYaz(n){ return n.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function maliToplamYazi(rows){
  const top={};
  (rows||[]).forEach(r=>{
    const n=maliSatirTutar(r);
    if(!n) return;
    const p=r.para||'TRY';
    top[p]=(top[p]||0)+n;
  });
  const s=Object.entries(top);
  return s.length?s.map(([p,n])=>paraYaz(n)+' '+p).join(' · '):paraYaz(0);
}
function maliBasOku(){

      if(el.checked) rows.forEach(r=>r[k]=[r[k], el.value].filter(Boolean).join(', '));

    rows.forEach(r=>r[k]=el.value);
  });

      const r=ui.form.skaler[f.uid], [a,b]=f.tip==='tarihara'?[r?.tarih,r?.vade]:[r?.bas,r?.bit];

        if(b<a){ ui.formSekme=sekmeAd(f); toast(f.ad+': bitiş başlangıçtan önce olamaz'); renderDrawer(); return false; }
      }
    }
    if(!f.zorunlu||f.tip==='gecmis'||fnErisim(f)!=='duzenle') continue;
    const liste=COKLU.has(f.tip)?(ui.form.coklu[f.uid]||[]):[ui.form.skaler[f.uid]];
    if(!liste.some(r=>r&&!degerBos(f,r))){ ui.formSekme=sekmeAd(f); toast(f.ad+' zorunlu'); renderDrawer(); return false; }
    if(f.tip==='kontrol'){ const L=liste.filter(r=>r&&!degerBos(f,r)); if(L.some(r=>!r.tur)){ ui.formSekme=sekmeAd(f); toast(f.ad+': bütün maddeler işaretlenmeli'); renderDrawer(); return false; } }
  }
  return true;
}
function kapanisIzni(mid, once, yeni){

  toast((durum(yeni)?.ad||'Bu durum')+' akışı kapatır; onay yetkisi gerekir');

}
function kaydetForm(){
  formDomOku(); sablonUygula();
  if(ui.form.tur==='proje') return kaydetProje();
  const m=modul(ui.form.modulId);
  if(!yazabilir(m.id)) return toast('Bu modülde yazma yetkin yok');
  if(!ui.form.projeId) return toast('Kayıt bir projeye bağlanmalı');
  if(!zorunluTamam(m)) return;
  let k=ui.form.id&&S.kartlar.find(x=>x.id===ui.form.id);
  if(!kapanisIzni(m.id, k?k.durumId:akis(m.id)[0]?.id, ui.form.durumId)) return;
  const yeni=!k;
  if(!k){ k={id:nid('k'), kod:yeniKod(m.onek||onekUret(m.ad), S.kartlar), modulId:m.id, yazarId:ui.uid}; S.kartlar.push(k); }
  const pred=d=>d.kartId===k.id;
  const once=fnOzetleri(m, pred), onceDurum=k.durumId, oncePrj=k.projeId;
  const eski=S.degerler.filter(pred);
  k.projeId=ui.form.projeId; k.durumId=ui.form.durumId;
  S.degerler=S.degerler.filter(d=>!pred(d));
  yazSatirlar(m,{projeId:k.projeId, modulId:m.id, kartId:k.id}, eski);
  rehberEkle();
  k.tarih=S.degerler.filter(d=>pred(d)&&d.fnTip!=='sure'&&d.fnTip!=='dokuman').map(d=>d.tarih||d.vade).find(Boolean)||'';
  denetle(k, yeni);
  const ortak={projeId:k.projeId, modulId:m.id, kartId:k.id};
  if(yeni) logEkle({...ortak, tip:'yeni', metin:'Kayıt açıldı'});
  else {
    if(onceDurum!==k.durumId) logEkle({...ortak, tip:'durum', alan:'Durum', eski:durum(onceDurum)?.ad||'', yeni:durum(k.durumId)?.ad||'', metin:'Durum değişti'});
    if(oncePrj!==k.projeId) logEkle({...ortak, tip:'alan', alan:'Proje', eski:proje(oncePrj)?.ad||'', yeni:proje(k.projeId)?.ad||'', metin:'Proje değişti'});
    alanLoglari(m, once, fnOzetleri(m, pred), ortak);
  }
  ui.form=null; persist(); toast('Kaydedildi'); render();
}
function kaydetProje(){
  if(!yazabilir('ana')) return toast('Proje yazma yetkin yok');
  if(!String(ui.form.ad||'').trim()) return toast('Proje adı zorunlu');
  const m=modul('ana');
  if(!zorunluTamam(m)) return;
  let p=ui.form.id&&proje(ui.form.id);
  if(!kapanisIzni('ana', p?p.durumId:akis('ana')[0]?.id, ui.form.durumId)) return;
  const yeni=!p;
  if(!p){ p={id:nid('p'), kod:yeniKod(m.onek||'PRJ', S.projeler)}; S.projeler.push(p); }
  const pred=d=>d.projeId===p.id&&!d.kartId;
  const once=fnOzetleri(m, pred);
  const eskiP={ad:p.ad||'', durum:durum(p.durumId)?.ad||'', kategori:p.kategori||'', yonetici:yoneticiler(p).map(u=>u.ad).join(', '), ekip:(p.ekip||[]).map(kisiAd).join(', '), arsiv:p.arsiv?'Evet':'Hayır'};
  const eski=S.degerler.filter(pred);
  Object.assign(p,{ad:ui.form.ad.trim(), durumId:ui.form.durumId, kategori:ui.form.kategori||'', arsiv:!!ui.form.arsiv, yonetici:[...(ui.form.yonetici||[])], ekip:ui.form.ekip||[]});
  S.degerler=S.degerler.filter(d=>!pred(d));
  yazSatirlar(m,{projeId:p.id, modulId:'ana', kartId:null}, eski);
  rehberEkle();
  denetle(p, yeni);
  const ortak={projeId:p.id, modulId:'ana', kartId:null};
  if(yeni) logEkle({...ortak, tip:'yeni', metin:'Proje açıldı'});
  else {
    const yeniP={ad:p.ad, durum:durum(p.durumId)?.ad||'', kategori:p.kategori, yonetici:yoneticiler(p).map(u=>u.ad).join(', '), ekip:(p.ekip||[]).map(kisiAd).join(', '), arsiv:p.arsiv?'Evet':'Hayır'};
    const AD={ad:'Ad', durum:'Durum', kategori:'Kategori', yonetici:'Yönetici', ekip:'Ekip', arsiv:'Arşiv'};
    Object.keys(AD).forEach(k=>{ if(eskiP[k]!==yeniP[k]) logEkle({...ortak, tip:k==='durum'?'durum':'alan', alan:AD[k], eski:eskiP[k], yeni:yeniP[k], metin:AD[k]+' değişti'}); });
    alanLoglari(m, once, fnOzetleri(m, pred), ortak);
  }
  ui.form=null; persist(); toast('Proje kaydedildi'); render();
}
function tasi(tip,id,durumId){
  if(tip==='p'){
    const p=proje(id); if(!p||!yazabilir('ana')||p.durumId===durumId) return;
    if(!kapanisIzni('ana', p.durumId, durumId)) return;
    const once=p.durumId; p.durumId=durumId; denetle(p,false);
    logEkle({projeId:p.id, modulId:'ana', kartId:null, tip:'durum', alan:'Durum', eski:durum(once)?.ad||'', yeni:durum(durumId)?.ad||'', metin:'Durum değişti'});
  } else {
    const k=S.kartlar.find(x=>x.id===id); if(!k||!yazabilir(k.modulId)||k.durumId===durumId) return;
    if(!kapanisIzni(k.modulId, k.durumId, durumId)) return;
    const once=k.durumId; k.durumId=durumId; denetle(k,false);
    logEkle({projeId:k.projeId, modulId:k.modulId, kartId:k.id, tip:'durum', alan:'Durum', eski:durum(once)?.ad||'', yeni:durum(durumId)?.ad||'', metin:'Durum değişti'});
  }
  persist(); render();
}
// README: yalnız ilk durumda olan ve işlem görmemiş kayıt veritabanından silinir; diğerleri "silindi" işaretlenir.
function islemGordu(tur, id){
  const L=S.log.filter(l=>tur==='kart'?l.kartId===id:(l.projeId===id&&!l.kartId));
  if(L.some(l=>l.tip==='durum'||l.tip==='alan')) return true;
  if(tur==='proje' && S.kartlar.some(k=>k.projeId===id)) return true;
  return false;
}
function silinebilir(tur, o){ const mid=tur==='kart'?o.modulId:'ana'; return o.durumId===akis(mid)[0]?.id && !islemGordu(tur,o.id); }
function kayitSil(tur){
  const o=tur==='kart'?S.kartlar.find(x=>x.id===ui.form.id):proje(ui.form.id); if(!o) return;
  const kalici=silinebilir(tur,o);
  const soru=kalici?'Kayıt ilk durumda ve işlem görmemiş. Veritabanından silinsin mi?':'Kayıt işlem görmüş. "Silindi" olarak işaretlenecek: listelerde görünmez, log ve tarih analizi durur. Devam edilsin mi?';
  if(!confirm(soru)) return;
  const ortak=tur==='kart'?{projeId:o.projeId, modulId:o.modulId, kartId:o.id}:{projeId:o.id, modulId:'ana', kartId:null};
  if(kalici){
    if(tur==='kart'){ S.degerler=S.degerler.filter(d=>d.kartId!==o.id); S.kartlar=S.kartlar.filter(x=>x.id!==o.id); }
    else { S.degerler=S.degerler.filter(d=>d.projeId!==o.id); S.projeler=S.projeler.filter(x=>x.id!==o.id); }
    logEkle({...ortak, tip:'sil', metin:o.kod+' kalıcı silindi (ilk durum, işlem görmemiş)'});
  } else {
    o.silindi=true; denetle(o,false);
    logEkle({...ortak, tip:'sil', metin:o.kod+' silindi olarak işaretlendi'});
  }
  ui.form=null; persist(); toast(kalici?'Kayıt silindi':'Kayıt silindi olarak işaretlendi'); render();
}

function kayitTarih(tur, id){
  const liste=tur==='proje'?tarihleri(d=>d.projeId===id&&!d.kartId):[S.kartlar.find(x=>x.id===id)?.tarih, ...tarihleri(d=>d.kartId===id)];
  return [...new Set(liste.filter(t=>/^\d{4}-\d{2}-\d{2}$/.test(t||'')))];
}
function takvimOgeler(){
  const hepsi=ui.takvim==='hepsi';
  const out=[];
  const koy=(tur,o,modulId)=>{
    const m=modul(modulId);
    out.push({tur, id:o.id, ad:tur==='proje'?o.ad:kartBaslik(o), kod:o.kod, modul:m?.ad||'', renk:m?.renk||'#2b62e3', tarihler:kayitTarih(tur,o.id)});
  };
  if(hepsi){
    if(yetki('ana')!=='yok') gorProjeler().forEach(p=>koy('proje',p,'ana'));
    S.moduller.filter(m=>m.tur!=='proje'&&yetki(m.id)!=='yok').forEach(m=>gorKartlar(m.id).forEach(k=>koy('kart',k,m.id)));
  } else {
    const m=modul(ui.modulId);
    if(!m) return out;
    if(m.tur==='proje') gorProjeler().forEach(p=>koy('proje',p,m.id));
    else gorKartlar().forEach(k=>koy('kart',k,m.id));
  }
  return out;
}
function takvimHTML(){
  const AY=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  const sim=/^\d{4}-\d{2}$/.test(ui.ay||'')?ui.ay:bugun().slice(0,7);
  const [y,mo]=sim.split('-').map(Number);
  const bas=new Date(y,mo-1,1);
  const bos=(bas.getDay()+6)%7;
  const adet=new Date(y,mo,0).getDate();
  const hucre=Math.ceil((bos+adet)/7)*7;
  const ogeler=takvimOgeler();
  const hepsi=ui.takvim==='hepsi';
  const cip=o=>`<button type="button" class="tk" style="--c:${o.renk}" data-act="${o.tur==='proje'?'ac-proje':'ac-kart'}" data-id="${o.id}" title="${esc(o.ad)}">${esc(o.kod)}${hepsi?' · '+esc(o.modul):''} ${esc(o.ad)}</button>`;

    return `<article class="card ${ui.form&&ui.form.id===k.id?'sel':''}" draggable="${yaz}" data-kart="${k.id}" data-act="ac-kart" data-id="${k.id}"><div class="t"><span>${esc(kartBaslik(k))}</span>${kartAcil(k)?'<span class="flag">Acil</span>':''}</div><div class="co">${ic('proje')}<span>${esc(p?.ad||'')}</span></div>${etiketHTML(m, d=>d.kartId===k.id)}${kanbanEk(m, d=>d.kartId===k.id)}${sistemKanban(m,k)}<div class="row"><span class="code-tag">${esc(k.kod)}</span>${tarihCip(k.tarih, !kapali(k.durumId))}<span class="stack">${kisi?av(kisi):''}</span></div></article>`;
  };
  const govde=ui.gorunum==='takvim'?takvimHTML():ui.gorunum==='liste'?listeHTML():kolonlar(m.id, liste, k=>k.durumId, kart);
  return bas+govde+printHTML();
}

/* ---------- panolar (bileşen sistemi) ---------- */
const BILESEN=[
  ['ozet','Özet sayılar','grid'],['teslim','Yaklaşan teslimler (kalan gün)','hedef'],['butce','Bütçe durumu','para'],
  ['atanan','Bana atanan işler','kisi'],['geciken','Gecikmeler','uyari'],['hareket','Son hareketler','gecmis'],
  ['firma','Son görüşmeye göre firmalar','bina'],['islem','İşlem görmeyen kayıtlar','saat'],['dagilim','Durum dağılımı','grafik'],
  ['mesaj','Okunmamış mesajlar','mesaj'],['efor','Efor özeti','saat'],['dosya','Onay bekleyen dosyalar','dosya'],['stok','Stok durumu','kutu']
];
const BLAD=Object.fromEntries(BILESEN.map(x=>[x[0],x[1]]));
const BLIK=Object.fromEntries(BILESEN.map(x=>[x[0],x[2]]));
function PF(pid){ return !ui.panoProje||pid===ui.panoProje; }
function gorunurKart(k){ const p=proje(k.projeId); return !k.silindi && p && !p.silindi && !p.arsiv && yetki(k.modulId)!=='yok'; }
function gorunurDeger(d){
  if(yetki(d.modulId)==='yok') return false;
  const p=proje(d.projeId); if(!p||p.silindi) return false;
  if(d.kartId){ const k=S.kartlar.find(x=>x.id===d.kartId); if(!k||k.silindi) return false; }
  const f=fnBul(d.fnUid); return !f||fnGorunur(f);
}
function okunmamis(){ const u=ben(); return S.degerler.filter(d=>d.fnTip==='mesaj' && kisiAd(d.kisi)!==u.ad && !(d.okuyan||[]).includes(u.id) && (!(d.alici||[]).length||d.alici.includes(u.id)) && gorunurDeger(d)); }
function sonTarih(k){ return [k.tarih, ...tarihleri(d=>d.kartId===k.id)].filter(Boolean).sort()[0]||''; }
function acikKartlar(){ return S.kartlar.filter(k=>gorunurKart(k)&&!kapali(k.durumId)&&PF(k.projeId)); }
function pPro(){ return projelerA().filter(p=>PF(p.id)); }
function gecikenler(){
  const out=[];
  acikKartlar().forEach(k=>{ const g=gunFark(k.tarih); if(g!==null&&g<0) out.push({tur:'kart',o:k,g}); });
  if(yetki('ana')!=='yok') pPro().filter(p=>!p.arsiv&&!kapali(p.durumId)).forEach(p=>{ const g=gunFark(projeTeslim(p)); if(g!==null&&g<0) out.push({tur:'proje',o:p,g}); });
  return out.sort((a,b)=>a.g-b.g);
}
function kayitSatir(tur,o,sag){
  const m=modul(tur==='proje'?'ana':o.modulId);
  const ad=tur==='proje'?o.ad:kartBaslik(o);
  const alt=tur==='proje'?(projeFirma(o)||m.ad):(m.ad+' · '+(proje(o.projeId)?.ad||''));
  return `<tr class="clk" data-act="${tur==='proje'?'ac-proje':'ac-kart'}" data-id="${o.id}"><td><span class="code-tag">${esc(o.kod)}</span></td><td><b>${esc(ad)}</b><div class="zaman">${esc(alt)}</div></td><td><span class="badge-t" style="--c:${durum(o.durumId)?.renk||'#7482a8'}">${esc(durum(o.durumId)?.ad||'')}</span></td><td class="sag">${sag||''}</td></tr>`;
}
function tablo(satirlar, bos){ return satirlar.length?`<div class="tbl"><table><tbody>${satirlar.join('')}</tbody></table></div>`:`<p class="empty">${esc(bos||'Kayıt yok')}</p>`; }
function bilesenHTML(b){
  const u=ben();
  const bas=`<h4>${ic(BLIK[b.tip])}${esc(b.ad||BLAD[b.tip])}</h4>`;
  let g='';
  switch(b.tip){
    case 'ozet': {
      const yuruyen=yetki('ana')!=='yok'?pPro().filter(p=>!p.arsiv&&!kapali(p.durumId)&&p.durumId!==akis('ana')[0]?.id).length:0;
      const atanan=acikKartlar().filter(atanmis);
      const gec=gecikenler();
      const hafta=acikKartlar().filter(k=>planVar([k.tarih,...tarihleri(d=>d.kartId===k.id)],'hafta')).length;
      const kpi=(ad,n,alt,act,bad)=>`<button type="button" class="kpi" ${act||''}><span>${ad}</span><b class="${bad&&n?'bad':''}">${n}</b><small>${alt}</small></button>`;
      g=`<div class="kpis">${kpi('Yürüyen proje',yuruyen,'Açık ve başlamış','data-act="git" data-id="ana"')}${kpi('Bana atanan açık iş',atanan.length,atanan.filter(k=>gunFark(k.tarih)<0).length+' gecikmiş')}${kpi('Geciken kayıt',gec.length,'tarihi geçmiş, açık','',true)}${kpi('Bu hafta planlanan',hafta,'tüm modüller')}${kpi('Okunmamış mesaj',okunmamis().filter(d=>PF(d.projeId)).length,'gelen kutusu','data-act="gelen"')}</div>`;
      break;
    }
    case 'teslim': {
      const gun=+b.gun||30;
      const L=yetki('ana')==='yok'?[]:pPro().filter(p=>!p.arsiv&&!kapali(p.durumId)).map(p=>({p,t:projeTeslim(p),g:gunFark(projeTeslim(p))})).filter(x=>x.g!==null&&x.g<=gun).sort((a,b)=>a.g-b.g);
      g=`<p class="zaman">Teslimine ${gun} gün ya da daha az kalan açık projeler</p>`+(L.length?`<div class="teslimler">${L.map(x=>`<div class="teslim" data-act="ac-proje" data-id="${x.p.id}"><div class="ust"><span class="code-tag">${esc(x.p.kod)}</span><span>${trh(x.t)}</span></div><div class="gun-n ${x.g<0?'gec':x.g<=7?'yakin':x.g<=15?'orta':''}">${Math.abs(x.g)}<small>${x.g<0?'gün geçti':x.g===0?'bugün':'gün kaldı'}</small></div><b>${esc(x.p.ad)}</b><span class="zaman">${esc(projeFirma(x.p))}</span></div>`).join('')}</div>`:'<p class="empty">Yaklaşan teslim yok</p>');
      break;
    }
    case 'butce': {
      const bf=(modul('ana')?.fn||[]).find(f=>f.tip==='fiyat');
      if(!bf) { g='<p class="empty">Ana modüle bir Fiyat fonksiyonu (Bütçe) bağla.</p>'; break; }
      if(!fnGorunur(bf)) { g='<p class="empty">Bütçe alanı senin grubuna kapalı.</p>'; break; }
      const sat=pPro().filter(p=>!p.arsiv).map(p=>{
        const bd=S.degerler.find(d=>d.projeId===p.id&&!d.kartId&&d.fnUid===bf.uid);
        const butce=bd?sayiOku(bd.tutar):0;
        let cik=0, gir=0;
        S.degerler.filter(d=>d.projeId===p.id&&d.fnTip==='mali'&&gorunurDeger(d)&&(d.para||'TRY')===(bd?.para||'TRY')).forEach(d=>{ const n=maliSatirTutar(d); if(d.hareket==='Giriş') gir+=n; else cik+=n; });
        if(!butce&&!cik&&!gir) return '';
        const yuz=butce?Math.round(cik/butce*100):0;
        const pb=bd?.para||'TRY';
        return `<tr class="clk" data-act="ac-proje" data-id="${p.id}"><td><span class="code-tag">${esc(p.kod)}</span></td><td><b>${esc(p.ad)}</b><div class="yuzde" style="margin-top:4px"><span class="bar ${yuz>100?'bad':yuz>80?'warn':'ok'}"><i style="width:${Math.min(100,yuz)}%"></i></span><span class="zaman">%${yuz}</span></div></td><td class="sag">${paraYaz(butce)} ${pb}<div class="zaman">bütçe</div></td><td class="sag">${paraYaz(cik)}<div class="zaman">harcanan</div></td><td class="sag">${paraYaz(gir)}<div class="zaman">gelir</div></td><td class="sag"><b style="color:var(${butce-cik<0?'--bad':'--ok'})">${paraYaz(butce-cik)}</b><div class="zaman">kalan</div></td></tr>`;
      }).filter(Boolean);
      g=`<p class="zaman">Bütçe = ana modüldeki "${esc(bf.ad)}" alanı. Harcanan/gelir = projeye bağlı mali hareketler (aynı para birimi).</p>`+(sat.length?`<div class="tbl"><table><tbody>${sat.join('')}</tbody></table></div>`:'<p class="empty">Bütçe girilmiş proje yok</p>');
      break;
    }
    case 'atanan': g=tablo(acikKartlar().filter(atanmis).sort((a,b)=>(a.tarih||'9').localeCompare(b.tarih||'9')).slice(0,12).map(k=>kayitSatir('kart',k,tarihCip(k.tarih,true).replace('class="dt','class="zaman dt'))), 'Sana atanmış açık iş yok'); break;
    case 'geciken': g=tablo(gecikenler().slice(0,12).map(x=>kayitSatir(x.tur,x.o,`<span class="pill p-bad">${-x.g} gün</span>`)), 'Geciken kayıt yok'); break;
    case 'hareket': {
      const L=S.log.filter(l=>yetki(l.modulId)!=='yok'&&PF(l.projeId)).slice(-12).reverse();
      g=L.length?`<div class="liste">${L.map(l=>`<div ${l.kartId||l.projeId?`class="clk" data-act="${l.kartId?'ac-kart':'ac-proje'}" data-id="${l.kartId||l.projeId}" style="cursor:pointer"`:''}>${logSatir(l)}</div>`).join('')}</div>`:'<p class="empty">Hareket yok</p>';
      break;
    }
    case 'firma': {
      const mods=(b.moduller&&b.moduller.length?b.moduller:['crm','toplanti']).filter(id=>modul(id)&&yetki(id)!=='yok');
      const veri=S.firmalar.map(f=>{
        const ks=S.kartlar.filter(k=>!k.silindi&&mods.includes(k.modulId)&&PF(k.projeId)).filter(k=>{
          const p=proje(k.projeId);
          return (p&&nrm(projeFirma(p))===nrm(f.ad)) || S.degerler.some(d=>d.kartId===k.id&&nrm(d.firma)===nrm(f.ad));
        });
        const son=ks.map(k=>k.tarih).filter(t=>t&&t<=bugun()).sort().pop()||'';
        const plan=ks.map(k=>k.tarih).filter(t=>t&&t>bugun()).sort()[0]||'';
        return {f, n:ks.filter(k=>k.tarih&&k.tarih<=bugun()).length, son, plan, g:son?-gunFark(son):null};
      }).sort((a,b)=>(b.g??1e9)-(a.g??1e9));
      g=`<p class="zaman">${mods.map(id=>modul(id).ad).join(', ')} kayıtlarına göre; en uzun süredir görüşülmeyen üstte</p>`+tablo(veri.slice(0,12).map(x=>`<tr class="clk" data-act="rehber-ac" data-id="${x.f.id}"><td><b>${esc(x.f.ad)}</b><div class="zaman">${x.n} görüşme</div></td><td class="sag">${x.son?`${trh(x.son)}<div class="zaman">${x.g===0?'bugün':x.g+' gün önce'}</div>`:'<span class="pill p-yok">Hiç görüşülmedi</span>'}${x.plan?`<div class="zaman">Planlı: ${trh(x.plan)}</div>`:''}</td></tr>`),'Rehberde firma yok');
      break;
    }
    case 'islem': {
      const gun=+b.gun||14, sinir=gunEkle(-gun);
      const L=acikKartlar().map(k=>{ const ls=S.log.filter(l=>l.kartId===k.id); const son=(ls.length?ls[ls.length-1].zaman:k.guncelleme)||''; return {k,son}; }).filter(x=>x.son.slice(0,10)<sinir).sort((a,b)=>a.son.localeCompare(b.son));
      g=`<p class="zaman">${gun} gündür hiç hareket görmeyen açık kayıtlar</p>`+tablo(L.slice(0,12).map(x=>kayitSatir('kart',x.k,`<span class="zaman">${x.son?(-gunFark(x.son))+' gün':'—'}</span>`)),'Hepsi hareketli');
      break;
    }
    case 'dagilim': {
      const mods=S.moduller.filter(m=>m.acik&&yetki(m.id)!=='yok');
      g=`<div class="dag">${mods.map(m=>{
        const L=m.tur==='proje'?pPro().filter(p=>!p.arsiv):S.kartlar.filter(k=>k.modulId===m.id&&gorunurKart(k)&&PF(k.projeId));
        const ds=akis(m.id); const n=L.length||1;
        return `<div class="dag-sat"><span><b>${esc(m.ad)}</b></span><span class="dag-bar">${ds.map(d=>{ const c=L.filter(o=>o.durumId===d.id).length; return c?`<i style="--c:${d.renk};width:${c/n*100}%" title="${esc(d.ad)}: ${c}"></i>`:''; }).join('')}</span><span class="zaman sag">${L.length}</span></div>`;
      }).join('')}</div><p class="zaman">Çubuğun üstüne gelince durum adı ve sayısı görünür.</p>`;
      break;
    }
    case 'mesaj': {
      const L=okunmamis().filter(d=>PF(d.projeId)).sort((a,b)=>String(b.zaman).localeCompare(String(a.zaman))).slice(0,8);
      g=L.length?`<div class="liste">${L.map(mesajSatir).join('')}</div>`:'<p class="empty">Okunmamış mesaj yok</p>';
      break;
    }
    case 'efor': {
      const top={};
      S.degerler.filter(d=>d.fnTip==='sure'&&gorunurDeger(d)&&PF(d.projeId)&&haftada(d.tarih)).forEach(d=>{ const k=kisiAd(d.kisi)||'—'; top[k]=(top[k]||0)+sayiOku(d.adet); });
      const L=Object.entries(top).sort((a,b)=>b[1]-a[1]); const mx=Math.max(1,...L.map(x=>x[1]));
      g=`<p class="zaman">Bu hafta Süre/Efor fonksiyonuna girilen saatler</p>`+(L.length?`<div class="dag">${L.map(([k,n])=>`<div class="dag-sat"><span class="who">${av(k)}${esc(k)}</span><span class="bar"><i style="width:${n/mx*100}%"></i></span><span class="zaman sag">${String(n).replace('.',',')} sa</span></div>`).join('')}</div>`:'<p class="empty">Bu hafta efor girilmedi</p>');
      break;
    }
    case 'dosya': {
      const L=S.degerler.filter(d=>d.fnTip==='dokuman'&&d.onay==='bekliyor'&&gorunurDeger(d)&&PF(d.projeId)&&dokGorur(d,d.projeId));
      g=tablo(L.slice(0,10).map(d=>{ const t=dokTur(d.dosya); return `<tr class="clk" data-act="${d.kartId?'ac-kart':'ac-proje'}" data-id="${d.kartId||d.projeId}"><td><span class="dtur" style="--c:${t.c}">${esc((t.uz||'?').toUpperCase().slice(0,4))}</span></td><td><b>${esc(d.dosya)}</b><div class="zaman">${esc(modul(d.modulId)?.ad||'')} · ${esc(proje(d.projeId)?.ad||'')}</div></td><td class="sag"><span class="pill p-warn">Onay bekliyor</span></td></tr>`; }),'Onay bekleyen dosya yok');
      break;
    }
    case 'stok': {
      const ds=S.depolar;
      const sat=S.malzemeler.map(mz=>{ const t=stokMiktar(mz.ad); const kr=mz.kritik&&t<sayiOku(mz.kritik); return `<tr><td><span class="code-tag">${esc(mz.kod)}</span></td><td><b>${esc(mz.ad)}</b></td>${ds.map(d=>`<td class="sag">${String(stokMiktar(mz.ad,d.id)).replace('.',',')}</td>`).join('')}<td class="sag"><b class="${kr?'stok-uyari':''}">${String(t).replace('.',',')} ${esc(mz.birim)}</b>${kr?'<div class="zaman">kritik altı</div>':''}</td></tr>`; });
      g=`<p class="zaman">Stok Hareketi fonksiyonlarından hesaplanır (tüm projeler)</p>`+(sat.length?`<div class="tbl"><table><thead><tr><th>Kod</th><th>Malzeme</th>${ds.map(d=>`<th class="sag">${esc(d.ad)}</th>`).join('')}<th class="sag">Toplam</th></tr></thead><tbody>${sat.join('')}</tbody></table></div>`:'<p class="empty">Malzeme yok</p>');
      break;
    }
  }
  return `<section class="bl ${b.genis==='tam'?'tam':''}">${bas}${g}</section>`;
}

function epostaHTML(){

/* ---------- dosya önizleme ---------- */
function driveOnizle(url){
  const u=String(url||'');
  let m=u.match(/drive\.google\.com\/file\/d\/([^/?#]+)/); if(m) return 'https://drive.google.com/file/d/'+m[1]+'/preview';
  m=u.match(/[?&]id=([^&#]+)/); if(/drive\.google\.com/.test(u)&&m) return 'https://drive.google.com/file/d/'+m[1]+'/preview';
  if(/docs\.google\.com\/(document|spreadsheets|presentation)\//.test(u)) return u.replace(/\/(edit|view)[^/]*$/,'')+'/preview';
  if(/onedrive\.live\.com\/embed|sharepoint\.com.*(embed|action=embedview)/i.test(u)) return u;
  return '';
}
function onizleHTML(){
  const o=ui.onizle; if(!o) return '';

  else if(o.resim) govde=`<img src="${o.resim}" alt="">`;

    const tip=r.tip||'';

    else if(tip==='application/pdf'||t.uz==='pdf'||tip.startsWith('text/')||['txt','md','json','csv'].includes(t.uz)) govde=`<iframe src="${url}" title="${esc(r.dosya)}"></iframe>`;
    else govde=`<div class="bos">${ic('dosya')}<b>.${esc(t.uz||'?')} dosyası tarayıcıda doğrudan önizlenemiyor</b><span>Word, Excel ve PowerPoint önizlemesi sunucu aşamasında Office Online / Google Docs görüntüleyicisi ile gelir.</span><button type="button" class="btn pri" data-act="onizle-indir">${ic('indir')}İndir</button></div>`;
  } else if(url){
    const emb=driveOnizle(url);

  } else govde=`<div class="bos">${ic('dosya')}<b>Dosya içeriği bu tarayıcıda yok</b><span>Örnek kayıt ya da büyük dosya; sunucu aşamasında depodan gelir.</span></div>`;
  const k=r.kartId&&S.kartlar.find(x=>x.id===r.kartId), p=proje(r.projeId||ui.form?.projeId||ui.form?.id);
  const kv=(a,b)=>b?`<dt>${a}</dt><dd>${b}</dd>`:'';
  const onayci=o.kayitli&&r.onay==='bekliyor'&&izin(r.modulId,'onay')&&yazabilir(r.modulId);

const Z_FONT=['Arial','Calibri','Georgia','Times New Roman','Verdana','Tahoma','Courier New'];
const Z_BOY=['12px','14px','16px','18px','20px','24px','32px'];
// Tablo/hücre için yalnız px genişlik-yükseklik tutulur (sürükleyerek ayarlanır)
function zBoyut(el){
  const tg=el.tagName; if(tg!=='TABLE'&&tg!=='TD'&&tg!=='TH') return '';
  const px=(v,min,max)=>{ const m=/^(\d+(?:\.\d+)?)px$/.exec((v||'').trim()); return m?Math.min(max,Math.max(min,Math.round(+m[1]))):0; };
  const tut=[];
  const gw=px(el.style.width, 20, 3000); if(gw) tut.push('width:'+gw+'px');
  if(tg==='TABLE'){ if(gw&&el.style.tableLayout==='fixed') tut.push('table-layout:fixed'); }
  else { const gh=px(el.style.height, 18, 2000); if(gh) tut.push('height:'+gh+'px'); }
  return tut.join(';');
}
function zTemiz(html){
  const d=document.createElement('div'); d.innerHTML=html||'';
  const izin2=new Set(['P','BR','B','STRONG','I','EM','U','S','STRIKE','DEL','UL','OL','LI','A','H2','H3','BLOCKQUOTE','DIV','SPAN','TABLE','THEAD','TBODY','TR','TH','TD','IMG']);
  d.querySelectorAll('*').forEach(el=>{
    if(!izin2.has(el.tagName)){ el.replaceWith(...el.childNodes); return; }
    if(el.tagName==='SPAN'){
      const fam=(el.style.fontFamily||'').replace(/["']/g,'').split(',')[0].trim();
      const boy=(el.style.fontSize||'').trim();
      const tut=[];
      if(Z_FONT.includes(fam)) tut.push('font-family:'+fam);
      if(Z_BOY.includes(boy)) tut.push('font-size:'+boy);
      [...el.attributes].forEach(a=>el.removeAttribute(a.name));
      if(!tut.length){ el.replaceWith(...el.childNodes); return; }
      el.setAttribute('style', tut.join(';'));
      return;
    }
    if(el.tagName==='IMG'){
      const src=el.getAttribute('src')||'';
      [...el.attributes].forEach(a=>el.removeAttribute(a.name));
      if(/^data:image\/(png|jpeg|webp);base64,/i.test(src) && src.length<500000) el.setAttribute('src', src);
      else el.remove();
      return;
    }
    const boyut=zBoyut(el);
    [...el.attributes].forEach(a=>{ if(a.name!=='href' && !((el.tagName==='TD'||el.tagName==='TH') && (a.name==='colspan'||a.name==='rowspan'))) el.removeAttribute(a.name); });
    if(boyut) el.setAttribute('style', boyut);
    if(el.tagName==='A' && !/^(https?:|mailto:)/i.test(el.getAttribute('href')||'')) el.removeAttribute('href');
  });
  const cik=d.innerHTML;
  return cik==='<br>'||cik==='<p><br></p>'?'':cik;
}

    ed.addEventListener('keydown', e=>{
      if(secili&&(e.key==='Delete'||e.key==='Backspace')){ e.preventDefault(); secili.remove(); secili=null; yaz(); }
      else if(secili&&e.key!=='Shift') secimiKaldir();
    });
    // Tablo: hücre kenarından sürükleyerek sütun genişliği / satır yüksekliği
    const KENAR=5;
    const kenar=(e)=>{
      const td=e.target.closest&&e.target.closest('td,th'); if(!td||!ed.contains(td)) return null;
      const r=td.getBoundingClientRect();
      if(r.right-e.clientX<=KENAR) return {td, yon:'sutun'};
      if(r.bottom-e.clientY<=KENAR) return {td, yon:'satir'};
      return null;
    };
    let surukle=null;
    ed.addEventListener('mousemove', e=>{ if(surukle||ed.contentEditable==='false') return; const k=kenar(e); ed.style.cursor=k?(k.yon==='sutun'?'col-resize':'row-resize'):''; });

      }

    const surukleBit=()=>{ if(!surukle) return; surukle=null; document.body.style.cursor=''; yaz(); src.dispatchEvent(new Event('change',{bubbles:true})); };
    const surukleHareket=e=>{

    cv.addEventListener('pointerdown',e=>{ ciz=true; cv.setPointerCapture(e.pointerId); const [x,y]=nok(e); cx.beginPath(); cx.moveTo(x,y); });
    cv.addEventListener('pointermove',e=>{ if(!ciz) return; const [x,y]=nok(e); cx.lineTo(x,y); cx.stroke(); });
    const bit=()=>{ if(!ciz) return; ciz=false; gizli.value=cv.toDataURL('image/png'); };
    cv.addEventListener('pointerup',bit); cv.addEventListener('pointercancel',bit);

    return `<div class="kp-satir"><div class="kp-ad"><span class="mono">${esc(p.kod)}</span><b>${esc(p.ad)}</b><small>${esc(projeFirma(p)||'')}</small></div><div class="kp-akis">${adim}</div><div class="kp-y">${y!=null?`<span class="kg-bar"><i style="width:${y}%"></i></span><b>%${y}</b>`:'<small>—</small>'}</div><div class="kp-n"><b>${kartlar.length}</b><small>açık kayıt</small></div><div class="kp-n ${gk?'bad':''}"><b>${gk}</b><small>gecikmiş</small></div><div class="kp-n ${g!==null&&g<0?'bad':g!==null&&g<7?'warn':''}"><b>${g===null?'—':g<0?'+'+(-g):g}</b><small>${g===null?'teslim yok':g<0?'gün gecikti':'gün kaldı'}</small></div></div>`;
  };
  return {kritik:L.some(x=>x.g!==null&&x.g<0), sayfalar:parcala(L,adet).map(p=>`<div class="kp-liste">${p.map(satir).join('')}</div>`)};
}
function kStok(s){

}
function kMesaj(s){
  const dep=kDep();
  const L=S.degerler.filter(d=>d.fnTip==='mesaj'&&String(d.metin||'').trim()&&gorunurDeger(d)&&PF(d.projeId)&&(!dep||kisiDep(d.kisi)===dep||(d.kartId&&kartDepte(S.kartlar.find(k=>k.id===d.kartId)||{})))).sort((a,b)=>String(b.zaman).localeCompare(String(a.zaman))).slice(0,+s.adet||6);

  return {sayfalar:[`<div class="km-liste">${L.map(d=>{ const k=d.kartId&&S.kartlar.find(x=>x.id===d.kartId); const yer=k?k.kod+' · '+kartBaslik(k):(proje(d.projeId)?.ad||''); return `<div class="km">${av(kisiAd(d.kisi))}<div class="km-g"><div class="km-u"><b>${esc(kisiAd(d.kisi))}</b><span>${esc(yer)}</span><span class="sp"></span><span>${esc(onceKac(d.zaman))}</span></div><p>${esc(String(d.metin).slice(0,220))}${(d.ekler||[]).length?' 📷':''}</p></div></div>`; }).join('')}</div>`]};
}
function kDurgun(s){
  const gun=+s.gun||10;
  const L=kProjeler().map(p=>{ const son=sonHareket(p); return {p,son,g:son?-gunFark(son):999}; }).filter(x=>x.g>=gun).sort((a,b)=>b.g-a.g);
  if(!L.length) return {bos:true, sayfalar:[bosEkran('onay','Bütün açık projelerde hareket var',gun+' günden uzun süredir işlem görmeyen proje yok',true)]};
  return {kritik:true, sayfalar:parcala(L,6).map(p=>`<p class="ko-not">${gun} gündür ya da daha uzun süredir akışında işlem görmeyen açık projeler</p><div class="kd-liste">${p.map(x=>{ const l=S.log.filter(z=>z.projeId===x.p.id).sort((a,b)=>String(b.zaman).localeCompare(String(a.zaman)))[0]; return `<div class="kd ${x.g>=gun*2?'cok':''}"><div class="kd-n"><b>${x.g>=999?'—':x.g}</b><small>GÜN</small></div><div class="kd-g"><span class="mono">${esc(x.p.kod)} · ${esc(durum(x.p.durumId)?.ad||'')}</span><b>${esc(x.p.ad)}</b><small>Yönetici: ${esc(yoneticiler(x.p).map(u=>u.ad).join(', ')||'—')}${l?' · Son işlem: '+esc(l.metin)+' ('+esc(trh(l.zaman))+')':''}</small></div></div>`; }).join('')}</div>`)};
}
function kSayac(){
  const bugunMu=l=>String(l.zaman).startsWith(bugun())&&logDepte(l);
  const acilan=S.log.filter(l=>l.tip==='yeni'&&bugunMu(l)).length;
  const kapanan=S.log.filter(l=>kapanisLogu(l)&&bugunMu(l)).length;
  const gec=gecikenler().filter(x=>x.tur==='kart'?kartDepte(x.o):projeDepte(x.o)).length;
  const acik=kKartlar().length;
  const yuruyen=kProjeler().length;
  const hafta=kProjeler().filter(p=>{ const g=gunFark(projeTeslim(p)); return g!==null&&g>=0&&g<=7; }).length;
  const t=(ad,n,c,ik)=>`<div class="ks-k ${c||''}">${ic(ik)}<b>${n}</b><span>${ad}</span></div>`;
  return {kritik:gec>0, sayfalar:[`<div class="ks-izgara">${t('Bugün açılan',acilan,'','arti')}${t('Bugün tamamlanan',kapanan,'ok','onay')}${t('Geciken',gec,gec?'bad':'','uyari')}${t('Açık kayıt',acik,'','kanban')}${t('Yürüyen proje',yuruyen,'','proje')}${t('7 gün içinde teslim',hafta,hafta?'warn':'','takvim')}</div>`]};
}
function kartSahipDep(k){
  const d=S.degerler.find(x=>x.kartId===k.id&&x.fnTip==='kisi'&&x.kisi&&S.kullanicilar.some(u=>u.id===x.kisi||u.ad===x.kisi));
  return kisiDep(d?(d.kisiId||d.kisi):k.olusturan);
}
function kDepartman(s){
  const bas=bugun(), pz=new Date(); pz.setDate(pz.getDate()+((7-pz.getDay())%7)); const haftaSon=iso(pz);
  const deps=(KS.k.departman?[KS.k.departman]:S.departmanlar).filter(Boolean);
  const ks=acikKartlar().filter(k=>!s.modul||k.modulId===s.modul);
  const R=deps.map(d=>{ const L=ks.filter(k=>kartSahipDep(k)===d); const t=k=>String(k.tarih||'').slice(0,10); return {d, top:L.length, gec:L.filter(k=>t(k)&&t(k)<bas).length, bugun:L.filter(k=>t(k)===bas).length, hafta:L.filter(k=>t(k)&&t(k)>=bas&&t(k)<=haftaSon).length}; }).filter(r=>r.top||!s.atla);
  if(!R.length) return {bos:true, sayfalar:[bosEkran('ekip','Açık iş yok','',true)]};
  const n=(v,ad,c)=>`<div class="kdp-n ${c&&v?c:''}"><b>${v}</b><small>${ad}</small></div>`;
  return {kritik:R.some(r=>r.gec), sayfalar:parcala(R,6).map(p=>`<div class="kdp-liste">${p.map(r=>`<div class="kdp"><div class="kdp-ad">${ic('ekip')}<b>${esc(r.d)}</b><small>${S.kullanicilar.filter(u=>u.aktif!==false&&u.departman===r.d).length} kişi</small></div>${n(r.top,'Toplam açık')}${n(r.gec,'Geciken','bad')}${n(r.bugun,'Bugün','warn')}${n(r.hafta,'Bu hafta','acc')}</div>`).join('')}</div>`)};
}
function kKullanim(s){
  const gun=+s.gun||30, adet=+s.adet||3, sinir=gunEkle(-gun);
  const U=S.kullanicilar.filter(u=>u.aktif!==false&&!u.sistem&&(!KS.k.departman||u.departman===KS.k.departman));
  const R=U.map(u=>{
    const l=S.log.filter(x=>x.kisi===u.ad&&String(x.zaman).slice(0,10)>=sinir).length;
    const m=S.degerler.filter(d=>d.fnTip==='mesaj'&&(d.kisi===u.ad||d.kisi===u.id)&&String(d.zaman).slice(0,10)>=sinir).length;
    const k=S.kartlar.filter(x=>x.olusturan===u.id&&String(x.olusturma).slice(0,10)>=sinir).length;
    return {u, n:l+m+k, l, m, k};
  }).sort((a,b)=>b.n-a.n);
  if(!R.length) return {bos:true, sayfalar:[bosEkran('kisi','Kullanıcı yok','')]};
  const kart=(r,i,tur)=>`<div class="ku ${tur}"><span class="ku-sira">${i+1}</span>${r.u.foto?`<img class="ku-foto" src="${r.u.foto}" alt="">`:`<span class="ku-foto">${esc(kisalt(r.u.ad))}</span>`}<div class="ku-g"><b>${esc(r.u.ad)}</b><small>${esc([r.u.unvan,r.u.departman].filter(Boolean).join(' · '))}</small><span class="ku-d">${r.k} kayıt · ${r.l} işlem · ${r.m} mesaj</span></div><div class="ku-n"><b>${r.n}</b><small>hareket</small></div></div>`;
  const cok=R.slice(0,adet), az=R.slice(-adet).reverse().filter(r=>!cok.includes(r));
  const kol=(bas,ik,L,tur)=>`<div class="ku-kol"><h3 class="${tur}">${ic(ik)}${bas}</h3>${L.map((r,i)=>kart(r,i,tur)).join('')||'<p class="ko-not">—</p>'}</div>`;
  const g=s.goster||'ikisi';
  return {sayfalar:[`<p class="ko-not">Son ${gun} gün · kayıt açma, alan/durum değişikliği ve mesajlar sayılır</p><div class="ku-izgara ${g==='ikisi'?'':'tek'}">${g!=='az'?kol('En aktif','yildiz',cok,'cok'):''}${g!=='cok'?kol('Daha az kullananlar','saat',az,'az'):''}</div>`]};
}
function galeriFotolari(){
  return S.degerler.filter(d=>d.fnTip==='dokuman'&&d.yildiz&&d.onem!=='gizli'&&gorunurDeger(d)&&PF(d.projeId)&&(dokTur(d.dosya).ad==='Görsel'||/^data:image\//.test(d.url||''))&&(/^data:image\//.test(d.url||'')||/^https?:.*\.(png|jpe?g|webp|gif|svg)(\?|$)/i.test(d.url||''))).sort((a,b)=>String(b.tarih||'').localeCompare(String(a.tarih||'')));
}
function kGaleri(s){
  const L=galeriFotolari();
  const bas=String(s.baslik||'').trim();
  const kapak=bas?[`<div class="kgl-kapak"><b>${esc(bas)}</b>${s.alt?`<span>${esc(s.alt)}</span>`:''}</div>`]:[];
  if(!L.length) return {bos:true, sayfalar:kapak.length?kapak:[bosEkran('grid','Galeride fotoğraf yok','Dosyalarda bir görselin yıldızına basın; yıldızlı fotoğraflar burada döner.')]};
  return {sayfalar:[...kapak, ...L.map(d=>{ const p=proje(d.projeId); const alt=[d.metin, p?.ad, projeFirma(p||{})].filter(Boolean); return `<div class="kgl"><img src="${esc(d.url)}" alt=""><div class="kgl-alt"><b>${esc(alt[0]||String(d.dosya||'').replace(/\.[^.]+$/,''))}</b><span>${esc(alt.slice(1).join(' · '))}</span></div></div>`; })]};
}
function kDuyuru(s){
  const m=String(s.metin||KS.k.duyuru||'').trim();
  if(!m) return {bos:true, sayfalar:[bosEkran('gonder','Duyuru yok','')]};
  return {sayfalar:[`<div class="kdu">${ic('gonder')}<p>${esc(m)}</p></div>`]};
}
function kBilesen(s){
  try{
    switch(s.tip){
      case 'geri': return kGeri(s); case 'ekip': return kEkip(s); case 'proje': return kProje(s); case 'stok': return kStok(s);
      case 'mesaj': return kMesaj(s); case 'durgun': return kDurgun(s); case 'sayac': return kSayac(s); case 'duyuru': return kDuyuru(s);
      case 'departman': return kDepartman(s); case 'kullanim': return kKullanim(s); case 'galeri': return kGaleri(s);
    }
  }catch(e){ console.error(e); return {sayfalar:[bosEkran('uyari','Bu sayfa çizilemedi',String(e.message||e))]}; }
  return {bos:true, sayfalar:['']};
}
function sayfaBaslik(s){
  if(s.ad) return s.ad;
  if(s.tip==='ekip'){ const m=modul(s.modul||'is'); return (KS.k.departman?KS.k.departman+' · ':'')+(m?m.ad:'Ekip'); }
  if(s.tip==='geri' && s.kaynak && s.kaynak!=='proje') return (modul(s.kaynak)?.ad||'')+' · geri sayım';
  return KBAD[s.tip];
}

/* --- ses: Web Audio ile kısa tonlar (dosya gerekmez) --- */
function kSes(tur){
  if(!KS||KS.k.ses==='kapali') return;
  try{
    const C=KS.ctx||(KS.ctx=new (window.AudioContext||window.webkitAudioContext)());
    if(C.state==='suspended') C.resume();
    const seq=tur==='alarm'?[[880,0],[660,.28],[880,.56],[660,.84]]:tur==='ok'?[[523,0],[659,.16],[784,.32],[1046,.48]]:tur==='uyari'?[[700,0],[700,.35]]:[[784,0],[1046,.2]];
    seq.forEach(([f,t])=>{ const o=C.createOscillator(), g=C.createGain(), s=C.currentTime+t; o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(0.4,s+0.02); g.gain.exponentialRampToValueAtTime(0.0001,s+0.26); o.connect(g).connect(C.destination); o.start(s); o.stop(s+0.3); });
  }catch(e){}
}
function sesKilitli(){ return KS && KS.k.ses!=='kapali' && (!KS.ctx || KS.ctx.state!=='running'); }

/* --- olay anonsları: yenilemeler arasında oluşan değişiklikler --- */
function kAnlik(){
  return {log:new Set(S.log.map(l=>l.id)), msj:new Set(S.degerler.filter(d=>d.fnTip==='mesaj').map(d=>d.id)), gec:new Set(gecikenler().map(x=>x.o.id)), duyuru:KS?KS.k.duyuru:''};
}
function kayitAdi(l){ const k=l.kartId&&S.kartlar.find(x=>x.id===l.kartId); if(k) return k.kod+' · '+kartBaslik(k); const p=proje(l.projeId); return p?p.kod+' · '+p.ad:''; }
function kFark(){
  const e=KS.gorulen, A=[];
  S.log.filter(l=>!e.log.has(l.id)&&kapanisLogu(l)&&logDepte(l)).forEach(l=>A.push({tur:'ok',ikon:'onay',bas:'TAMAMLANDI',metin:kayitAdi(l),alt:l.kisi+' · '+(modul(l.modulId)?.ad||'')}));
  S.degerler.filter(d=>d.fnTip==='mesaj'&&!e.msj.has(d.id)&&gorunurDeger(d)&&PF(d.projeId)).slice(-3).forEach(d=>A.push({tur:'mesaj',ikon:'mesaj',bas:'YENİ MESAJ',metin:String(d.metin||'').slice(0,140),alt:kisiAd(d.kisi)+' · '+(proje(d.projeId)?.ad||'')}));
  gecikenler().filter(x=>!e.gec.has(x.o.id)&&(x.tur==='kart'?kartDepte(x.o):projeDepte(x.o))).forEach(x=>A.push({tur:'alarm',ikon:'uyari',bas:'GECİKMEYE GİRDİ',metin:x.o.kod+' · '+(x.tur==='proje'?x.o.ad:kartBaslik(x.o)),alt:x.tur==='proje'?'Proje teslim tarihi geçti':(modul(x.o.modulId)?.ad||'')}));
  if(KS.k.duyuru&&KS.k.duyuru!==e.duyuru) A.push({tur:'mesaj',ikon:'gonder',bas:'DUYURU',metin:KS.k.duyuru,alt:''});
  KS.gorulen=kAnlik();
  return A;
}
function anonsGoster(){
  const el=$('#kiosk .ko-anons'); if(!el||!KS) return;
  if(KS.anonsAkt||!KS.anons.length) return;
  const a=KS.anons.shift(); KS.anonsAkt=a;
  el.className='ko-anons on '+a.tur;
  el.innerHTML=`<div>${ic(a.ikon)}<b>${esc(a.bas)}</b><p>${esc(a.metin)}</p>${a.alt?`<span>${esc(a.alt)}</span>`:''}</div>`;
  kSes(a.tur);
  clearTimeout(KS.anonsT);
  KS.anonsT=setTimeout(()=>{ if(!KS) return; KS.anonsAkt=null; el.className='ko-anons'; setTimeout(anonsGoster,600); }, 8000);
}

/* --- akış --- */
function kioskHash(){
  const h=location.hash.slice(1); if(!h.startsWith('kiosk=')) return null;
  const p=new URLSearchParams(h); return {id:p.get('kiosk'), k:p.get('k')||'', firma:p.get('firma')||''};
}
function kKiosk(){ return KS && S.kiosklar.find(x=>x.id===KS.id); }
function kioskBaslat(h){
  kioskDurdur();
  // API modunda S sunucudan gelen veridir; tarayıcıdaki şablon verisiyle değiştirilirse eşitleme onu sunucuya yazar
  // (kiosk tanımlarını ezer, sunucu şifresi olan kullanıcıların şifresini sıfırlar).
  if(!API.acik) S=yukle(h.firma||localStorage.getItem('yerp-firma')||'yontem');
  let el=$('#kiosk'); if(!el){ el=document.createElement('div'); el.id='kiosk'; document.body.appendChild(el); }
  $('#app').hidden=true; $('#drawer')&&($('#drawer').hidden=true); el.hidden=false;
  document.title='Kiosk · '+S.firma.ad;
  const k=S.kiosklar.find(x=>x.id===h.id);
  if(!k||k.anahtar!==h.k){ document.documentElement.dataset.theme='dark'; el.innerHTML=`<div class="kiosk"><main class="ko-govde">${bosEkran('kilit','Kiosk bağlantısı geçersiz','Ayarlar → Kiosklar bölümünden güncel bağlantıyı kopyalayın. Çıkmak için Esc.')}</main></div>`; KS={id:h.id, gecersiz:true}; return; }
  KS={id:k.id, k, sub:S.firma.sub, i:0, alt:0, parca:null, kalan:0, dur:false, anons:[], anonsAkt:null, ctx:null, sonYenile:Date.now(), sonYeniden:new Date()};
  kioskKullanici();
  KS.gorulen=kAnlik();
  el.innerHTML=`<div class="kiosk" tabindex="-1"><header class="ko-ust"></header><main class="ko-govde"></main><footer class="ko-alt"></footer><div class="ko-ilerle"><i></i></div><div class="ko-anons"></div><div class="ko-ipucu">F tam ekran · ← → sayfa · Boşluk duraklat · Esc çıkış</div></div>`;
  try{ KS.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  kSayfaGit(0, true);
  KS.saat=setInterval(kTik, 1000);
  KS.yeniden=setTimeout(()=>location.reload(), 6*3600e3); // uzun açık kalan ekranda belleği tazeler
  setTimeout(()=>{ const i=$('#kiosk .ko-ipucu'); if(i) i.classList.add('gizle'); }, 8000);
}
function kioskKullanici(){
  const k=KS.k, y={}; S.moduller.forEach(m=>y[m.id]='oku');
  KU={id:'kiosk:'+k.id, ad:k.ad, rol:k.grup?'personel':'yonetici', grup:k.grup, yetki:y, ek:{}, gorunum:{}, panoGizli:{}, aktif:true};
  ui.panoProje=k.projeId||'';
  document.documentElement.dataset.theme=k.tema==='light'?'light':'dark';
  const kv=$('#kiosk .kiosk'); if(kv) kv.style.setProperty('--ko', +k.olcek||1);
}
function kioskDurdur(){
  if(!KS) return;
  clearInterval(KS.saat); clearTimeout(KS.yeniden); clearTimeout(KS.anonsT);
  try{ KS.ctx&&KS.ctx.close(); }catch(e){}
  KS=null; KU=null;
}
function kioskBitir(){
  kioskDurdur();
  const el=$('#kiosk'); if(el){ el.hidden=true; el.innerHTML=''; }
  $('#app').hidden=false; document.title='Yöntem ERP';
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  if(location.hash.startsWith('#kiosk=')) history.replaceState(null,'',location.pathname+location.search);
  const tema=localStorage.getItem('yerp-tema'); document.documentElement.dataset.theme=tema||'light';
  ui.panoProje='';
  if(API.acik){ ui.ekran='ayar'; ui.ayar='kiosk'; render(); persist(); return; } // S zaten sunucu verisi; yereldekini yükleme
  acFirma(localStorage.getItem('yerp-firma')||'yontem');
  ui.ekran='ayar'; ui.ayar='kiosk'; render();
}
function kSayfalar(){ return (KS.k.sayfalar||[]).filter(s=>KBAD[s.tip]); }
function kSayfaGit(i, ilk){
  const L=kSayfalar(); if(!L.length){ KS.parca=null; kCiz(true); return; }
  // boş sayfaları atla (hepsi boşsa ilkini göster)
  for(let d=0; d<L.length; d++){
    const j=((i+d)%L.length+L.length)%L.length, s=L[j], r=kBilesen(s);
    if(r.bos && s.atla && L.length>1 && d<L.length-1) continue;
    KS.i=j; KS.alt=0; KS.parca=r; KS.kalan=+s.sure||20;
    kCiz(true);
    if(!ilk && r.kritik && KS.k.ses==='hepsi' && !KS.anonsAkt) kSes('uyari');
    return;
  }
}
function kSonraki(yon){
  const r=KS.parca;
  if(r && yon>0 && KS.alt<r.sayfalar.length-1){ KS.alt++; KS.kalan=+kSayfalar()[KS.i].sure||20; kCiz(true); return; }
  if(r && yon<0 && KS.alt>0){ KS.alt--; KS.kalan=+kSayfalar()[KS.i].sure||20; kCiz(true); return; }
  kSayfaGit(KS.i+(yon<0?-1:1));
}
function kYenile(){
  if(!KS||KS.gecersiz) return;
  const veri=localStorage.getItem(anahtar(KS.sub));
  if(veri){ try{ S=migrate(JSON.parse(veri)); }catch(e){ return; } }
  const k=S.kiosklar.find(x=>x.id===KS.id);
  if(!k){ kioskBaslat({id:KS.id,k:'',firma:KS.sub}); return; }
  if(k.anahtar!==KS.k.anahtar){ kioskBaslat({id:KS.id,k:'',firma:KS.sub}); return; }
  KS.k=k; kioskKullanici();
  KS.sonYenile=Date.now(); KS.sonYeniden=new Date();
  KS.anons.push(...kFark()); anonsGoster();
  const L=kSayfalar(); if(!L.length){ KS.parca=null; kCiz(false); return; }
  if(KS.i>=L.length) KS.i=0;
  KS.parca=kBilesen(L[KS.i]); if(KS.alt>=KS.parca.sayfalar.length) KS.alt=0;
  kCiz(false);
}
function kTik(){
  if(!KS||KS.gecersiz) return;
  kUstCiz();
  if(Date.now()-KS.sonYenile >= (Math.max(10,+KS.k.yenile||30))*1000) kYenile();
  if(KS.dur||KS.anonsAkt) return;
  if(--KS.kalan<=0) kSonraki(1);
}
function kUstCiz(){
  const el=$('#kiosk .ko-ust'); if(!el||!KS) return;
  const L=kSayfalar(), s=L[KS.i], r=KS.parca, d=new Date();
  const kapsam=[KS.k.departman, KS.k.projeId&&proje(KS.k.projeId)?.ad].filter(Boolean).join(' · ');
  const logo=S.firma.logo?`<img src="${S.firma.logo}" alt="">`:`<span class="ko-logo-y">${ic('bina')}</span>`;
  el.innerHTML=`<span class="ko-marka">${logo}<span><b>${esc(S.firma.ad)}</b><small>${esc(KS.k.ad)}</small></span></span><span class="ko-ayrac"></span><span class="ko-bas">${s?ic(KBIK[s.tip])+esc(sayfaBaslik(s)):esc(KS.k.ad)}${r&&r.sayfalar.length>1?`<small>${KS.alt+1}/${r.sayfalar.length}</small>`:''}</span>${kapsam?`<span class="ko-kapsam">${esc(kapsam)}</span>`:''}<span class="sp"></span><span class="ko-nok">${L.map((x,i)=>`<i class="${i===KS.i?'on':''}"></i>`).join('')}</span>${sesKilitli()?`<button type="button" class="ko-ses" data-ko="ses">${ic('uyari')}Ses için tıklayın</button>`:''}${KS.dur?'<span class="ko-dur">DURAKLATILDI</span>':''}<span class="ko-saat">${d.toTimeString().slice(0,5)}<small>${d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'})}</small></span>`;
}
function kCiz(sifirla){
  const el=$('#kiosk .kiosk'); if(!el||!KS) return;
  el.style.setProperty('--ko', +KS.k.olcek||1);
  kUstCiz();
  const L=kSayfalar(), r=KS.parca;
  $('#kiosk .ko-govde').innerHTML=!L.length?bosEkran('pano','Bu kioskta sayfa yok','Ayarlar → Kiosklar bölümünden sayfa ekleyin.'):(r?r.sayfalar[KS.alt]||'':'');
  const dy=String(KS.k.duyuru||'').trim();
  $('#kiosk .ko-alt').innerHTML=`${dy?`<div class="ko-kayan">${ic('gonder')}<div><span>${esc(dy)}</span></div></div>`:'<span class="sp"></span>'}<span class="ko-canli"><i></i>Canlı · ${KS.sonYeniden.toTimeString().slice(0,8)}</span><button type="button" class="ko-geri" data-ko="geri" title="Kiosktan çık (Esc)" aria-label="Kiosktan çık">${ic('sol')}</button>`;
  if(sifirla){
    const bar=$('#kiosk .ko-ilerle i'); const s=L[KS.i];
    bar.style.animation='none'; void bar.offsetWidth;
    bar.style.animation=s?`ko-ilerle ${(+s.sure||20)}s linear forwards`:'none';
  }

}
function kioskOlay(){
  document.addEventListener('keydown', e=>{
    if(!KS) return;
    if(e.key==='Escape'){ e.stopImmediatePropagation(); if(document.fullscreenElement) return; kioskBitir(); return; }
    if(KS.gecersiz) return;
    if(e.key==='ArrowRight'){ kSonraki(1); }
    else if(e.key==='ArrowLeft'){ kSonraki(-1); }
    else if(e.key===' '){ e.preventDefault(); KS.dur=!KS.dur; kCiz(false); }
    else if(e.key==='f'||e.key==='F'){ tamEkran(); }
    else if(e.key==='t'||e.key==='T'){ KS.anons.push({tur:'ok',ikon:'onay',bas:'DENEME ANONSU',metin:'Ses ve anons çalışıyor',alt:KS.k.ad}); anonsGoster(); }
    else return;
    e.stopImmediatePropagation();
  }, true);
  document.addEventListener('click', e=>{
    if(!KS||!e.target.closest('#kiosk')) return;
    if(KS.ctx&&KS.ctx.state!=='running') KS.ctx.resume().then(()=>kUstCiz()).catch(()=>{});
    if(e.target.closest('[data-ko="ses"]')){ kSes('mesaj'); tamEkran(); }
    if(e.target.closest('[data-ko="geri"]')){ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); kioskBitir(); }
  });
  window.addEventListener('storage', e=>{ if(KS&&!KS.gecersiz&&e.key===anahtar(KS.sub)){ clearTimeout(KS.st); KS.st=setTimeout(kYenile, 400); } });
  window.addEventListener('hashchange', ()=>{ const h=kioskHash(); if(h) kioskBaslat(h); else if(KS) kioskBitir(); });
}

/* --- veri görünümü (ortak tabloların birleşimi) --- */
function ckKatalog(m, satir){
  const L=[], proj=m.tur==='proje';
  const ekle=(ad,grup,tip,sql,deger)=>{ let k=ad,i=2; while(L.some(x=>nrm(x.k)===nrm(k))) k=ad+' '+(i++); L.push({k,grup,tip:tip||'metin',sql,deger}); };
  const sf=satir&&satir!=='kayit'?(m.fn||[]).find(f=>f.uid===satir&&fnGorunur(f)):null;
  if(sf){
    (CK_ALT[sf.tip]||[['Değer','_ozet']]).forEach(([ad,alan,tip])=>ekle(ad,sf.ad+' satırı',tip==='depo'||tip==='kisi'||tip==='tamam'||tip==='sonuc'?'metin':tip,'s.'+(alan==='_ozet'?'metin':alan),c=>{
      const r=c.r; if(!r) return '';
      if(alan==='_ozet') return ozet(r);
      const v=r[alan];
      if(tip==='depo') return depoAd(v); if(tip==='kisi') return kisiAd(v); if(tip==='tamam') return v==='tamam'?'✓':''; if(tip==='sonuc') return SONUC_AD[v]||'';
      if(alan==='metin') return duz(v||'');
      return v??'';
    }));
  }
  if(proj){
    ekle('Kod','Kayıt','metin','p.kod',c=>c.p.kod);
    ekle('Proje','Kayıt','metin','p.ad',c=>c.p.ad);
  } else {
    ekle('Kod','Kayıt','metin','k.kod',c=>c.o.kod);
    ekle('Başlık','Kayıt','metin','k.baslik',c=>kartBaslik(c.o));
    ekle('Belge tarihi','Kayıt','tarih','k.tarih',c=>c.o.tarih||'');
  }
  ekle('Durum','Kayıt','metin','dr.ad',c=>durum(c.o.durumId)?.ad||'');
  ekle('Kaydeden','Kayıt','metin','k.olusturan',c=>kisiAd(c.o.olusturan));
  ekle('Kayıt tarihi','Kayıt','tarih','k.olusturma',c=>c.o.olusturma||'');
  ekle('Güncelleyen','Kayıt','metin','k.guncelleyen',c=>kisiAd(c.o.guncelleyen));
  ekle('Güncelleme tarihi','Kayıt','tarih','k.guncelleme',c=>c.o.guncelleme||'');
  if(!proj){
    ekle('Proje kodu','Proje','metin','p.kod',c=>c.p?.kod||'');
    ekle('Proje','Proje','metin','p.ad',c=>c.p?.ad||'');
    ekle('Proje firması','Proje','metin',"fn(p,'firma')",c=>c.p?projeFirma(c.p):'');
    ekle('Proje durumu','Proje','metin','pd.ad',c=>durum(c.p?.durumId)?.ad||'');
    ekle('Proje teslim','Proje','tarih',"fn(p,'tarih')",c=>c.p?projeTeslim(c.p):'');
  }
  (m.fn||[]).filter(f=>fnGorunur(f)&&f.uid!==satir&&!['gecmis','mesaj'].includes(f.tip)).forEach(f=>{
    const ds=c=>S.degerler.filter(d=>d.fnUid===f.uid&&(proj?d.projeId===c.p.id&&!d.kartId:d.kartId===c.o.id));
    const kol=f.tip==='fiyat'?'tutar':f.tip==='tarih'?'tarih':['sayi','yuzde'].includes(f.tip)?'adet':f.tip==='firma'?'firma':f.tip==='kisi'?'kisi':f.tip==='imza'?'url':'metin';
    const sql=`fn('${f.uid}').${kol}`;
    if(f.tip==='imza') ekle(f.ad,'Fonksiyon','resim',sql,c=>ds(c)[0]?.url||'');
    else if(f.tip==='fiyat') ekle(f.ad,'Fonksiyon','para',sql,c=>ds(c)[0]?.tutar||'');
    else if(f.tip==='sayi') ekle(f.ad,'Fonksiyon','sayi',sql,c=>ds(c)[0]?.adet||'');
    else if(f.tip==='yuzde') ekle(f.ad,'Fonksiyon','yuzde',sql,c=>ds(c)[0]?.adet||'');
    else if(f.tip==='tarih') ekle(f.ad,'Fonksiyon','tarih',sql,c=>ds(c)[0]?.tarih||'');
    else if(f.tip==='zengin'||f.tip==='rich'||f.tip==='sablon') ekle(f.ad,'Fonksiyon','html',sql,c=>ds(c)[0]?.metin||'');
    else ekle(f.ad,'Fonksiyon','metin',sql,c=>ds(c).map(ozet).filter(Boolean).join(' | '));
  });
  L.gizli=(m.fn||[]).filter(f=>!fnGorunur(f)).map(f=>nrm(f.ad));
  return L;
}
function ckSqlTek(q, F, ust){
  const m=modul(q.modulId); if(!m) return '';
  const kat=ckKatalog(m,q.satir), proj=m.tur==='proje';
  const sec=(q.alanlar&&q.alanlar.length?kat.filter(a=>q.alanlar.includes(a.k)):kat);
  const satir=q.satir&&q.satir!=='kayit';
  const t=proj?'p':'k';
  const kosul=[proj?'p.silindi = 0':`k.modul_id = '${m.id}' AND k.silindi = 0`];
  if(satir) kosul.push(`s.fn_uid = '${q.satir}'`);
  kosul.push(`${t}.modul_id IN (SELECT modul_id FROM kullanici_yetki WHERE kullanici_id = :kullanici AND yetki <> 'yok')  -- otomatik`);
  if(F.kapsam!=='kayit') kosul.push(`(:kisi IS NULL OR ${t}.olusturan = :kisi)  -- yetkisiz kullanıcıda :kisi = kendisi`);
  if(q.tarihAlan){ const a=kat.find(x=>x.k===q.tarihAlan); if(a) kosul.push(`${a.sql} BETWEEN :donem_bas AND :donem_bit`); }
  (q.kosullar||[]).forEach(k=>{ const a=kat.find(x=>x.k===k.alan); if(a) kosul.push(`${a.sql} ${k.op==='icerir'?'LIKE':k.op==='!='?'<>':'='} '${k.op==='icerir'?'%'+k.deger+'%':k.deger}'`); });
  if(q===F&&F.kapsam==='kayit') kosul.push(`${t}.id = :kayit_id`);
  if(ust){ const a=kat.find(x=>x.k===q.bagAlan); kosul.push(`${a?a.sql:'?'} = ust."${q.ustAlan}"  -- iç içe: ${ust} satırına bağlı`); }
  const from=proj?'FROM projeler p':`FROM ${satir?'degerler s\n  JOIN kartlar k ON k.id = s.kart_id':'kartlar k'}\n  JOIN projeler p ON p.id = k.proje_id`;
  return `SELECT\n${sec.map(a=>`  ${a.sql} AS "${a.k}"`).join(',\n')}\n${from}\n  LEFT JOIN durumlar dr ON dr.id = ${t}.durum_id\nWHERE ${kosul.join('\n  AND ')}${q.sirala?`\nORDER BY "${q.sirala}"`:''}`;
}
function ckSql(F){
  const ad=id=>id==='ana'?'satirlar':((F.ekSorgular||[]).find(x=>x.id===id)||{}).ad;
  const L=[`-- ${F.ad}\n-- fn('uid') = degerler tablosundan o fonksiyonun değeri\n\n-- satirlar (ana sorgu)\n${ckSqlTek(F,F,'')}`];
  (F.ekSorgular||[]).forEach(q=>L.push(`-- ${q.ad}${q.ust?' (iç içe → '+ad(q.ust)+')':' (bağımsız)'}\n${ckSqlTek(q,F,q.ust?ad(q.ust):'')}`));
  return L.join(';\n\n')+';';
}
function ckDonemAralik(d, ay){
  const t=new Date(), y=t.getFullYear(), m=t.getMonth();
  const ilk=(Y,M)=>iso(new Date(Y,M,1)), son=(Y,M)=>iso(new Date(Y,M+1,0));
  const AY=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  if(d==='bu-ay') return {bas:ilk(y,m),bit:son(y,m),ad:AY[m]+' '+y};
  if(d==='gecen-ay'){ const g=new Date(y,m-1,1); return {bas:ilk(g.getFullYear(),g.getMonth()),bit:son(g.getFullYear(),g.getMonth()),ad:AY[g.getMonth()]+' '+g.getFullYear()}; }
  if(d==='bu-yil') return {bas:y+'-01-01',bit:y+'-12-31',ad:String(y)};
  if(d==='ay'&&/^\d{4}-\d{2}$/.test(ay||'')){ const [Y,M]=ay.split('-').map(Number); return {bas:ilk(Y,M-1),bit:son(Y,M-1),ad:AY[M-1]+' '+Y}; }
  return null;
}
function ckYetki(F){
  const m=modul(F.modulId);
  if(!m||yetki(m.id)==='yok') return {ok:false, not:'Bu çıktının modülünde yetkin yok.'};
  const hepsi=ben().rol==='yonetici'||izin(m.id,'disa');
  return {ok:true, hepsi, not:!hepsi&&F.kapsam!=='kayit'?'Dışa aktarma yetkin olmadığı için yalnız kendi kayıtların listelenir.':''};
}
// kişi süzgeci: yetkili seçer; yetkisiz yalnız kendini görür
function ckKisi(F, o){
  const y=ckYetki(F);
  if(F.kapsam==='kayit') return '';
  if(!y.hepsi) return ben().id;
  if(o.kisi!==undefined) return o.kisi;
  return F.kisi==='ben'?ben().id:'';
}
// q: sorgu tanımı (ana form ya da ek sorgu). kapsam/kişi/dönem formdan gelir.
function ckVeri(q, o, F){
  F=F||q;
  const m=modul(q.modulId);

function ckListe(ds, satirlar){ const L=satirlar.slice(); Object.defineProperty(L,'__d',{value:ds}); return L; }

function ckDeger(a, v, filtre){

function ckToplam(ds, L, alan){ const a=ds.kat.find(x=>nrm(x.k)===nrm(alan)); if(!a) return null; return {a, t:L.reduce((t,v)=>t+sayiOku(v[a.k]),0)}; }
function ckTablo(ds, L){

/* şablon motoru: {{yol|biçim}}, ||yol||, {% for x in liste %}…{% endfor %} (iç içe), {% if yol %}…{% endif %}, tablo satırı tekrarı */
function ckRender(F, veri){
  const {ana, D}=veri, u=ben();
  const G={bugun:trh(bugun()), simdi:trh(simdi()), kullanici:u.ad, unvan:u.unvan||'', departman:u.departman||'', firma:S.firma.ad, donem:ana.donem?ana.donem.ad:'Tüm zamanlar', form:F.ad};
  const gizli=new Set(Object.values(D).flatMap(d=>d.gizli||[]));
  const cozT=s=>{ const t=document.createElement('textarea'); t.innerHTML=s; return t.value; };
  const sorguBul=ad=>{ const k=Object.keys(D).find(x=>nrm(x)===nrm(ad)); return k?D[k]:null; };
  const tum=ds=>ckListe(ds, ds.satirlar);
  // kapsamda liste çöz: "satirlar", "Masraflar", "p.Masraflar", tekrar için bağlı ad
  const listeCoz=(ifade, sc)=>{
    const p=ifade.split('.').map(x=>x.trim()).filter(Boolean);
    if(p.length===1){
      for(let i=sc.length-1;i>=0;i--){ const r=sc[i].satir; if(r&&Array.isArray(r[p[0]])&&r[p[0]].__d) return r[p[0]]; const k=r&&Object.getOwnPropertyNames(r).find(x=>nrm(x)===nrm(p[0])&&Array.isArray(r[x])); if(k) return r[k]; }
      const ds=sorguBul(p[0]); return ds?tum(ds):null;
    }
    const v=sc.slice().reverse().find(s=>nrm(s.ad)===nrm(p[0]));
    if(v&&v.satir){ const k=Object.getOwnPropertyNames(v.satir).find(x=>nrm(x)===nrm(p[1])&&Array.isArray(v.satir[x])); if(k) return v.satir[k]; }
    return null;
  };
  const hata=x=>{ const n=nrm(cozT(x).split('|')[0].trim().split('.').pop()); return gizli.has(n)?'':`<span class="ck-hata" title="Bilinmeyen alan">{{${esc(x)}}}</span>`; };
  const ozel=(L, rest, filtre)=>{ // liste üzerinde adet / toplam.X / tablo / ilk satır alanı
    const ds=L.__d;
    if(!rest.length||nrm(rest[0])==='adet') return String(L.length);
    if(nrm(rest[0])==='tablo') return ckTablo(ds, L);
    if(nrm(rest[0])==='toplam'){ const t=ckToplam(ds, L, rest.slice(1).join('.')); return t?ckDeger({tip:t.a.tip},t.t,filtre||(t.a.tip==='para'?'para':'sayi')):null; }
    const a=ds.kat.find(x=>nrm(x.k)===nrm(rest.join('.'))); return a?ckDeger(a,(L[0]||{})[a.k],filtre):null;
  };
  const coz=(ifade, sc)=>{
    const [yol, filtre]=cozT(ifade).split('|').map(x=>x.trim()); const p=(yol||'').split('.').map(x=>x.trim());
    const n0=nrm(p[0]);
    if(n0==='sira'&&p.length===1){ const s=sc[sc.length-1]; return s?String(s.sira):hata(ifade); }
    if(n0==='tablo'&&p.length===1) return ckTablo(ana, tum(ana));
    if(n0==='adet'&&p.length===1) return String(ana.satirlar.length);
    if(n0==='toplam'&&p.length>1){ const r=ozel(tum(ana), p, filtre); return r??hata(ifade); }
    // döngü/tekrar değişkeni
    for(let i=sc.length-1;i>=0;i--){
      const s=sc[i]; if(nrm(s.ad)!==n0) continue;
      if(p.length===1) return hata(ifade);
      const ch=Object.getOwnPropertyNames(s.satir).find(x=>nrm(x)===nrm(p[1])&&Array.isArray(s.satir[x]));
      if(ch){ const r=ozel(s.satir[ch], p.slice(2), filtre); return r??hata(ifade); }
      const a=s.ds.kat.find(x=>nrm(x.k)===nrm(p.slice(1).join('.'))); return a?ckDeger(a,s.satir[a.k],filtre):hata(ifade);
    }
    if(n0==='s') return ''; // döngü dışında satır alanı
    const gk=Object.keys(G).find(k=>nrm(k)===n0); if(gk&&p.length===1) return ckDeger(null,G[gk],filtre);
    // sorgu adı: Masraflar.adet / Masraflar.toplam.Tutar / Masraflar.tablo / iç içe: üst satırın alt listesi
    if(p.length>1){ const L=listeCoz(p[0], sc); if(L){ const r=ozel(L, p.slice(1), filtre); return r??hata(ifade); } }

    const a=ana.kat.find(x=>nrm(x.k)===nrm(yol)); if(a) return ckDeger(a,(ana.satirlar[0]||{})[a.k],filtre);

  const yer=(str,sc)=>str.replace(/\{\{\s*([^}]+?)\s*\}\}|\|\|\s*([^|<>]+?)\s*\|\|/g,(_,a,b)=>coz(a||b,sc));

    if(derin>8) return html;

    const dv=document.createElement('div'); dv.innerHTML=html;
    dv.querySelectorAll('tr').forEach(tr=>{

      let ad=null, L=null;
      for(const x of mm){

}

async function sifreOzet(sifre, tuz){
  const veri=new TextEncoder().encode((tuz||'')+':'+sifre);
  try{ const h=await crypto.subtle.digest('SHA-256', veri); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let h=5381; for(const b of veri) h=((h<<5)+h+b)|0; return 'z'+(h>>>0).toString(16); }
}
async function sifreDogru(u, sifre){ if(!u.sifre) return sifre===(u.ilkSifre||VARSAYILAN_SIFRE); return (await sifreOzet(sifre, u.id))===u.sifre; }
async function sifreAyarla(u, sifre){ u.sifre=await sifreOzet(sifre, u.id); u.sifreTarih=simdi(); }
function oturumAnahtar(sub){ return 'yerp-oturum:'+sub; }
function oturumOku(sub){
  try{ const r=sessionStorage.getItem(oturumAnahtar(sub))||localStorage.getItem(oturumAnahtar(sub)); if(!r) return null; const o=JSON.parse(r); const u=S.kullanicilar.find(x=>x.id===o.uid); return u&&u.aktif!==false?o:null; }catch(e){ return null; }
}
function oturumYaz(sub, uid, hatirla){
  const v=JSON.stringify({uid, zaman:simdi()});
  try{ sessionStorage.setItem(oturumAnahtar(sub), v); if(hatirla) localStorage.setItem(oturumAnahtar(sub), v); else localStorage.removeItem(oturumAnahtar(sub)); }catch(e){}
}
function oturumKapat(){
  uiSil();
  try{ sessionStorage.removeItem(oturumAnahtar(S.firma.sub)); localStorage.removeItem(oturumAnahtar(S.firma.sub)); }catch(e){}
  ui.form=null; ui.cekmece=null; ui.eposta=null;

function oturumAc(uid, hatirla){

}

async function girisYap(form){
  const ep=form.elements.eposta.value.trim().toLocaleLowerCase('tr'), sf=form.elements.sifre.value;
  const u=S.kullanicilar.find(x=>String(x.eposta||'').toLocaleLowerCase('tr')===ep);
  if(u&&u.kilit&&u.kilit>new Date().toISOString()) return girisGoster('Çok fazla hatalı deneme. '+Math.ceil((new Date(u.kilit)-new Date())/60000)+' dakika sonra tekrar dene.', ep);
  if(!u||u.aktif===false||!(await sifreDogru(u,sf))){
    if(u){ u.hatali=(u.hatali||0)+1; if(u.hatali>=5){ u.kilit=new Date(Date.now()+5*60000).toISOString(); u.hatali=0; } persist(); }
    return girisGoster(u&&u.aktif===false?'Bu kullanıcı pasif. Yöneticine başvur.':'E-posta ya da şifre hatalı.', ep);
  }
  try{ localStorage.setItem('yerp-son-eposta:'+S.firma.sub, u.eposta); }catch(e){}
  oturumAc(u.id, form.elements.hatirla.checked);
  if(!u.sifre) setTimeout(()=>toast('İlk şifreyle girdin. Profilim → Güvenlik bölümünden şifreni değiştir.'), 300);
}
// Form gönderimi: kısıtlı çerçevelerde (sandbox, allow-forms yok) tarayıcı submit olayını hiç üretmez.
// Bu yüzden gönder butonu ve Enter tuşu elle yakalanır, submit olayı kodla tetiklenir.
function formGonderimi(){
  const gonder=f=>{ if(!f.checkValidity()){ f.reportValidity(); return; } f.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true})); };
  document.addEventListener('click', e=>{
    const b=e.target.closest&&e.target.closest('button[type=submit],input[type=submit]'); if(!b||!b.form||b.disabled) return;
    e.preventDefault(); gonder(b.form);
  }, true);
  document.addEventListener('keydown', e=>{
    if(e.key!=='Enter'||e.isComposing||e.ctrlKey||e.metaKey||e.shiftKey) return;
    const t=e.target; if(!(t instanceof HTMLInputElement)||!t.form) return;
    if(['checkbox','radio','button','submit','file','reset'].includes(t.type)) return;
    if(!t.form.querySelector('button[type=submit],input[type=submit]')){ e.preventDefault(); return; }
    e.preventDefault(); gonder(t.form);
  }, true);
}
function girisOlay(){
  formGonderimi();
  document.addEventListener('submit', e=>{ if(e.target.id==='girisForm'){ e.preventDefault(); girisYap(e.target); } });
  document.addEventListener('click', e=>{
    const b=e.target.closest('[data-gr]'); if(!b) return;
    if(b.dataset.gr==='goster'){ const i=b.parentElement.querySelector('input'); i.type=i.type==='password'?'text':'password'; }
    if(b.dataset.gr==='unuttum') toast('Şifre sıfırlama bağlantısı sunucu aşamasında e-postana gönderilir. Şablonda yöneticin Ayarlar → Kullanıcılar → "Şifreyi sıfırla" ile sıfırlar.');
  });
  document.addEventListener('change', e=>{ if(e.target.id==='grFirma'){ localStorage.setItem('yerp-firma', e.target.value); S=yukle(e.target.value); girisGoster(); } });
}

/* ---------- sunucu (API) modu ----------
   Sayfa bir sunucudan (Vercel / IIS) açılıp /api/saglik cevap verirse şablon "API modunda" çalışır:
   giriş sunucuda yapılır, veri /api/durum'dan yüklenir ve her persist() çağrısında değişen kayıtlar
   ilgili API uçlarına gönderilir. Dosyadan (file://) ya da önizlemede açılınca eski localStorage modu sürer. */
const API={acik:false, ben:null, son:null, zamanlayici:0, kuyruk:Promise.resolve(), eskiSifre:'', yukleniyor:false, firma:null};
function csrfOku(){ return decodeURIComponent((document.cookie.match(/(?:^|; )erp_csrf=([^;]+)/)||[])[1]||''); }
async function apiIstek(yol, sec={}){
  const govde=sec.govde===undefined?undefined:JSON.stringify(sec.govde);
  let r;
  try{ r=await fetch('/api'+yol, {method:sec.method||'GET', credentials:'same-origin', headers:{'Content-Type':'application/json','X-CSRF-Token':csrfOku()}, body:govde}); }
  catch(e){ throw Object.assign(new Error('Sunucuya ulaşılamadı. İnternet bağlantını kontrol et.'),{durum:0}); }
  const v=await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(v.hata||('Sunucu hatası ('+r.status+')')),{durum:r.status, veri:v});
  return v;
}
async function apiVarMi(){
  if(!/^https?:$/.test(location.protocol)) return false;
  try{ const r=await fetch('/api/saglik',{credentials:'same-origin', cache:'no-store'}); if(!r.ok) return false; return !!(await r.json()).ok; }catch(e){ return false; }
}

/* zaman: sunucu ISO (UTC) ↔ şablon "YYYY-AA-GG SS:DD" (yerel) */
function yerelZaman(v){
  if(!v) return ''; if(!/T/.test(v)) return v;
  const d=new Date(v); if(isNaN(d)) return v;
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function isoZaman(v){
  if(!v) return ''; if(/T.*(Z|[+-]\d\d:?\d\d)$/.test(v)) return v;
  const d=new Date(String(v).replace(' ','T')); return isNaN(d)?'':d.toISOString();
}

/* sunucudan gelen durumu şablon biçimine getir */
function durumUygula(v){
  v.projeler.forEach(p=>{ p.olusturma=yerelZaman(p.olusturma); p.guncelleme=yerelZaman(p.guncelleme); });
  v.kartlar.forEach(k=>{ k.olusturma=yerelZaman(k.olusturma); k.guncelleme=yerelZaman(k.guncelleme); k.yazarId=k.olusturan; });
  v.degerler.forEach(d=>{ d.zaman=yerelZaman(d.zaman); });
  v.log.forEach(l=>{ l.zaman=yerelZaman(l.zaman); });
  v.kioskKuruldu=true; v.ciktiSurum2=true;
  v.seq=Number(String(Date.now()).slice(-8))*10+Math.floor(Math.random()*10); // kullanıcılar arasında çakışmayan yerel kimlikler
  const s=migrate(v);
  return s;
}
async function durumYukle(){
  const v=await apiIstek('/durum');
  S=durumUygula(v);
  baglantiIsaretleriniTemizle();
  API.son=iz(S);
}

/* ---- değişiklik izi: son eşitlenen hal ile şimdiki hal karşılaştırılır ---- */
const ayir=(L,f)=>{ const o={}; L.forEach(x=>{ const k=f(x); (o[k]=o[k]||[]).push(x); }); return o; };
function degerIz(L){ return JSON.stringify(L.slice().sort((a,b)=>String(a.id).localeCompare(String(b.id)))); }
const AYAR_TABLO=[
  {t:'yetki_gruplari', k:'id', L:s=>s.yetkiGruplari.map((g,i)=>({id:g.id, ad:g.ad, sira:i}))},
  {t:'departmanlar', k:'ad', L:s=>s.departmanlar.map((d,i)=>({ad:d, sira:i}))},
  {t:'moduller', k:'id', L:s=>s.moduller.map((m,i)=>({id:m.id, ad:m.ad, renk:m.renk, ikon:m.ikon, onek:m.onek, tur:m.tur||'kart', acik:m.acik!==false, sira:i, sistem:m.sistem||{}}))},
  {t:'durumlar', k:'id', L:s=>s.moduller.flatMap(m=>(m.durumlar||[]).map((d,i)=>({id:d.id, modul_id:m.id, ad:d.ad, renk:d.renk, sira:i, kapat:!!d.kapat})))},
  {t:'fonksiyonlar', k:'uid', L:s=>s.moduller.flatMap(m=>(m.fn||[]).map((f,i)=>({uid:f.uid, modul_id:m.id, tip:f.tip, ad:f.ad, zorunlu:!!f.zorunlu, grup:f.grup||null, tarih_vars:f.tarihVarsayilan||'', ...(f.sekme?{sekme:String(f.sekme)}:{}), kanban:!!f.kanban, liste:f.liste!==false, sira:i, yetki:f.yetki||{}})))},
  {t:'opsiyonlar', k:'id', L:s=>s.opsiyonlar.map((o,i)=>({id:o.id, grup:o.grup, ad:o.ad, varsayilan:!!o.varsayilan, tur:o.tur||'select', sira:i}))},
  {t:'depolar', k:'id', L:s=>s.depolar.map((d,i)=>({id:d.id, ad:d.ad, sira:i}))},
  {t:'malzemeler', k:'id', herkes:true, L:s=>s.malzemeler.map(m=>({id:m.id, kod:m.kod||'', ad:m.ad, birim:m.birim||'', kritik:String(m.kritik??'').trim()===''?null:sayiOku(m.kritik)}))},
  {t:'rehber_firmalar', k:'id', herkes:true, L:s=>s.firmalar.map(f=>({id:f.id, ad:f.ad, vergi_no:f.vergiNo||'', vd:f.vd||'', tel:f.tel||'', eposta:f.eposta||'', adres:f.adres||'', notu:f.not||''}))},
  {t:'rehber_kisiler', k:'id', herkes:true, L:s=>s.kisiler.map(k=>({id:k.id, ad:k.ad, firma_id:k.firmaId||null, unvan:k.unvan||'', tel:k.tel||'', eposta:k.eposta||''}))},
  ...['sablonlar','panolar','kiosklar','ciktilar'].map(t=>({t, k:'id', L:s=>s[t].map((x,i)=>{ const {id,ad,sira,...tanim}=x; return {id, ad, sira:i, tanim}; })})),
];
const KUL_ALAN=u=>({ad:u.ad, unvan:u.unvan||'', eposta:String(u.eposta||'').toLowerCase(), tel:u.tel||'', rol:u.rol, grup_id:u.grup||null, departman:u.departman||null, aktif:u.aktif!==false});
const KUL_YETKI=u=>{ const o={}; new Set([...Object.keys(u.yetki||{}), ...Object.keys(u.ek||{})]).forEach(m=>{ const y=(u.yetki||{})[m]||'yok', e=(u.ek||{})[m]||{}; if(y!=='yok') o[m]={yetki:y, onay:!!e.onay, disa:!!e.disa}; }); return o; };
const PROFIL=u=>({ad:u.ad, tel:u.tel||'', foto:u.foto||'', tercih:{gorunum:u.gorunum||{}, acilis:u.acilis||'pano', panoGizli:u.panoGizli||{}}});
const EPOSTA=u=>{ const h={...(u.epostaHesap||{tur:'yok'})}; ['bagli','zaman','sifre','sifreKayitli'].forEach(k=>delete h[k]); Object.keys(h).forEach(k=>{ if(k!=='tur'&&(h[k]===''||h[k]==null)) delete h[k]; }); h.tur=h.tur||'yok'; return h; };
function iz(s){
  const dP=ayir(s.degerler.filter(d=>!d.kartId), d=>d.projeId), dK=ayir(s.degerler.filter(d=>d.kartId), d=>d.kartId);
  const o={proje:{}, kart:{}, ayar:{}, kul:{}, kulY:{}, kulS:{}, firma:'', profil:'', eposta:''};
  s.projeler.forEach(p=>{ if(!p.silindi) o.proje[p.id]=JSON.stringify({ad:p.ad, durumId:p.durumId, kategori:p.kategori||'', arsiv:!!p.arsiv, yonetici:p.yonetici||[], ekip:p.ekip||[]})+degerIz(dP[p.id]||[]); });
  s.kartlar.forEach(k=>{ if(!k.silindi) o.kart[k.id]=JSON.stringify({projeId:k.projeId, durumId:k.durumId})+degerIz(dK[k.id]||[]); });
  AYAR_TABLO.forEach(A=>{ const m={}; A.L(s).forEach(r=>{ m[r[A.k]]=JSON.stringify(r); }); o.ayar[A.t]=m; });
  s.kullanicilar.forEach(u=>{ o.kul[u.id]=JSON.stringify(KUL_ALAN(u)); o.kulY[u.id]=JSON.stringify(KUL_YETKI(u)); o.kulS[u.id]=u.sifre?'1':''; });
  const f={...s.firma}; delete f.sub; o.firma=JSON.stringify(f);
  const b=s.kullanicilar.find(u=>u.id===ui.uid);
  if(b){ o.profil=JSON.stringify(PROFIL(b)); o.eposta=JSON.stringify(EPOSTA(b)); }
  return o;
}
