<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yöntem ERP Şablon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f7f7f8;--surface:#fff;--surface-2:#f1f1f3;--line:#e4e4e7;--inp:#fff;--ph:#9a9aa5;
  --fg:#18181b;--muted:#63636e;--accent:#2b62e3;--accent-soft:#e3ebfd;--on-accent:#fff;
  --side:#0f1a38;--side-fg:#c9d3ea;--side-active:#2b62e3;--brand:#d42a2f;
  --ok:#1f9d6b;--ok-soft:#dcf3ea;--warn:#c77a0a;--warn-soft:#fbefd9;--bad:#cf3640;--bad-soft:#fbe3e5;
  --r:8px;--f:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0e0e10;--surface:#161618;--surface-2:#1f1f22;--line:#2c2c31;--inp:#1b1b1e;--ph:#6c6c76;
  --fg:#ededef;--muted:#a0a0aa;--accent:#6b93ff;--accent-soft:#1f2c55;--on-accent:#fff;
  --side:#080d1b;--side-fg:#aeb9d6;--side-active:#3a6cf0;
  --ok:#3ccf94;--ok-soft:#123528;--warn:#f0a83a;--warn-soft:#3a2a0e;--bad:#ff6b74;--bad-soft:#3d161b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::placeholder{color:var(--ph);opacity:1}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;display:inline-block;vertical-align:middle}
.mono,.code-tag{font-family:var(--f-mono)}
.code-tag{font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap}

/* iskelet */
.app{height:100vh;display:grid;grid-template-columns:232px minmax(0,1fr);position:relative}
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;gap:3px;padding:14px 10px 16px;overflow:auto;scrollbar-color:rgba(255,255,255,.25) transparent}
.logo{display:flex;gap:10px;align-items:center;color:#fff;font-weight:800;padding:4px 8px 14px;line-height:1.15}
.logo img{width:36px;height:36px;object-fit:contain;background:#fff;border-radius:8px}
.logo .sun{width:36px;height:36px;border-radius:8px;background:var(--brand);display:grid;place-items:center;font-size:16px}
.logo small{display:block;font-weight:600;color:#8ea0c8;font-size:11px}
.grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#7482a8;font-weight:800;padding:12px 12px 4px}
.side button.nav{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;font-weight:600;font-size:13.5px}
.side button.nav:hover{background:rgba(255,255,255,.06)}
.side button.nav.on{background:var(--side-active);color:#fff}
.side button.nav:focus-visible{outline:2px solid #fff}
.side button.nav .nb{margin-left:auto;font-size:10px;font-weight:800;background:var(--bad);color:#fff;border-radius:999px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center}
.harf{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--c,#2b62e3);color:#fff;font-size:11px;font-weight:800;flex:none}
.harf .ic{width:13px;height:13px}
.side .foot{margin-top:auto;font-size:12px;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:10px 12px;display:flex;gap:8px;align-items:center}
.side .foot div{display:grid;gap:2px;min-width:0}
.side .foot b{color:#fff;font-size:13px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--muted);font-size:13px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.search input{all:unset;flex:1;color:var(--fg);min-width:0}
.sp{flex:1}
.icon,.ibtn{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--muted);position:relative;flex:none}
.icon:hover,.ibtn:hover{background:var(--surface-2);color:var(--fg)}
.icon:focus-visible,.ibtn:focus-visible{outline:2px solid var(--accent)}
.icon.on,.ibtn.on{background:var(--accent-soft);color:var(--accent)}
.ibtn.sm{width:28px;height:28px}
.ibtn.sm .ic{width:14px;height:14px}
.ibtn.danger:hover{background:var(--bad-soft);color:var(--bad)}
.ibtn .badge{position:absolute;top:3px;right:3px;background:var(--bad);color:#fff;font-size:9px;font-weight:800;border-radius:999px;min-width:15px;height:15px;padding:0 3px;display:grid;place-items:center}
.menu-btn{display:none}
.content{flex:1;overflow:auto;padding:16px 18px 28px;display:flex;flex-direction:column;gap:14px}
.phead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.phead .pic{width:42px;height:42px;border-radius:8px;background:var(--c,var(--accent));color:#fff;display:grid;place-items:center;flex:none}
.phead .pic .ic{width:22px;height:22px}
.phead h3{margin:0;font-size:21px;font-weight:800;line-height:1.2}
.phead p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.phead .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .sp{min-width:8px}

/* butonlar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:8px;font-weight:700;font-size:13px;line-height:1.25;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.btn .ic{width:15px;height:15px}
.btn.pri,.btn.yeni{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover,.btn.yeni:hover{filter:brightness(1.07)}
.btn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ok{color:var(--ok)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.sq{padding:7px 8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px;gap:2px}
.seg button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.seg button .ic{width:15px;height:15px}
.sel,.topbar select{font:inherit;font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--inp);color:var(--fg)}
.sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}

/* rozetler */
.tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.badge-t{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--c,var(--accent)) 15%,var(--surface));color:color-mix(in srgb,var(--c,var(--accent)) 80%,var(--fg));white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.p-ok{background:var(--ok-soft);color:var(--ok)}
.pill.p-warn{background:var(--warn-soft);color:var(--warn)}
.pill.p-bad{background:var(--bad-soft);color:var(--bad)}
.pill.p-yok{background:var(--surface-2);color:var(--muted)}
.flag{font-size:10.5px;font-weight:800;color:var(--bad);background:var(--bad-soft);padding:1px 6px;border-radius:4px;flex:none;align-self:flex-start}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* takvim */
.takvim{display:grid;gap:8px}
.tk-ust{display:flex;gap:8px;align-items:center}
.tk-ust b{font-size:16px;min-width:140px;text-align:center}
.tk-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.tk-ad{font-size:11px;font-weight:800;color:var(--muted);text-align:center;padding:2px;text-transform:uppercase;letter-spacing:.05em}
.gun{min-height:112px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px;display:flex;flex-direction:column;gap:3px}
.gun.dis{background:transparent;border-style:dashed}
.gun.bugun{box-shadow:inset 0 0 0 2px var(--accent)}
.gun>span{font-size:12px;font-weight:800}
.tk{all:unset;cursor:pointer;display:block;max-width:100%;font-size:11px;font-weight:700;padding:2px 5px;border-radius:4px;background:color-mix(in srgb,var(--c,#2b62e3) 16%,var(--surface));border-left:3px solid var(--c,#2b62e3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk:hover{background:color-mix(in srgb,var(--c,#2b62e3) 30%,var(--surface))}
.tk-yan{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* fonksiyon ayar satırları */
.fn-ekle{display:flex;gap:8px;align-items:center}
.fn-ekle select,.fn-ekle input:not([type=color]){font:inherit;font-size:14px;font-weight:400;color:var(--fg);flex:1;width:auto;min-width:0;max-width:320px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--inp)}
.fn-ekle select:focus,.fn-ekle input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.fn-form{display:grid;gap:8px}
.fn-satir{display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;color:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.fn-satir>.ic{color:var(--muted)}
.fn-satir div{display:grid;gap:1px;min-width:0}
.fn-satir span{font-weight:700;font-size:13px;color:var(--fg)}
.fn-satir b{font-weight:400;font-size:11.5px;color:var(--muted)}
.fn-satir:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.fn-satir.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.fn-satir.over{outline:2px dashed var(--accent);outline-offset:2px}

/* pano (kanban) */
.board{display:flex;gap:10px;overflow:auto;align-items:stretch;min-height:420px;flex:1;padding-bottom:6px}
.col{flex:1 0 230px;max-width:300px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--c) 6%,var(--surface-2));padding:0 8px 8px;display:flex;flex-direction:column;gap:8px;min-height:220px;overflow:auto}
.col.over{outline:2px dashed var(--accent);outline-offset:-3px}
.colh{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;border-bottom:2px solid var(--c);padding:12px 3px 7px;position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--c) 6%,var(--surface-2))}
.colh .n{color:var(--muted);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.colh .kp{margin-left:auto;color:var(--muted)}
.colh .kp .ic{width:13px;height:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px;cursor:pointer;text-align:left}
.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.card.sel{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent)}
.card[draggable="true"]{cursor:grab}
.card .t{font-weight:800;font-size:13px;line-height:1.3;display:flex;justify-content:space-between;gap:6px}
.card .t>span:first-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .co{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px;min-width:0}
.card .co .ic{width:13px;height:13px}
.card .co span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sis{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;opacity:.75;white-space:nowrap;overflow:hidden}
.card .sis .ic{width:12px;height:12px;flex:none}
.card .sis span{overflow:hidden;text-overflow:ellipsis}
.card .sis .mono{font-size:10.5px;flex:none}
.card .row{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11.5px}
.card .row .dt{display:inline-flex;align-items:center;gap:4px}
.card .row .dt .ic{width:13px;height:13px}
.card .row .dt.gec{color:var(--bad);font-weight:700}
.card .sub{color:var(--muted);font-size:11.5px}
.card .sub b{color:var(--fg);font-weight:700}
.stack{display:flex;margin-left:auto}
.stack .av{margin-left:-6px;border:2px solid var(--surface);box-sizing:content-box}
.stack .av:first-child{margin-left:0}
.kisi-cip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 9px 2px 2px;font:inherit;font-weight:700;font-size:12px;color:var(--fg)}
button.kisi-cip{cursor:pointer}
.kisi-cip:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.kisi-cip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.kisi-cip:disabled{opacity:.55;cursor:default}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--fg)}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;overflow:hidden;color:#fff;font-size:9px;font-weight:800;background:hsl(var(--h,220) 42% 42%);flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.foto-on{width:72px;height:72px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}

/* dosyalar */
.dtur{flex:none;font:700 10px/1 var(--f-mono);padding:4px 5px;border-radius:4px;color:color-mix(in srgb,var(--c) 72%,var(--fg));background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.dok-liste{display:grid;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.dok-sat{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);min-width:0;font-weight:400;color:var(--fg)}
.dok-sat:last-child{border-bottom:0}
.dok-sat .ad{display:grid;min-width:0;flex:1}
.dok-sat .ad b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dok-sat .ad span{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dok-sat .ad span .ic{width:12px;height:12px}
.dok-sat .ad .rz{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;align-items:center}
.dok-sat .eyl{display:flex;gap:0;flex:none;align-self:flex-start}
.dok-duz{display:grid;gap:8px;padding:10px;border-bottom:1px solid var(--line);background:var(--bg)}
.dok-bos{padding:14px;color:var(--muted);font-size:12.5px;text-align:center}
.birak{border:1.5px dashed var(--line);border-radius:8px;padding:14px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-weight:600;font-size:12.5px;background:var(--surface)}
.birak.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.birak .ic{width:18px;height:18px}
.dok-on{max-width:100%;max-height:240px;border:1px solid var(--line);border-radius:8px;background:#fff;object-fit:contain}
iframe.dok-on{width:100%;height:320px;max-height:none}
.depo{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.depo.gdrive{background:color-mix(in srgb,#1fa463 15%,var(--surface));color:color-mix(in srgb,#1fa463 80%,var(--fg))}
.depo.nas{background:color-mix(in srgb,#7a5af0 15%,var(--surface));color:color-mix(in srgb,#7a5af0 80%,var(--fg))}
.depo.nasbekle{background:var(--warn-soft);color:var(--warn)}
.panel.soluk{opacity:.7}
.depo.onedrive{background:color-mix(in srgb,#0a64d6 15%,var(--surface));color:color-mix(in srgb,#0a64d6 80%,var(--fg))}

/* tablolar */
.tbl{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);white-space:nowrap;font-weight:800}
td.sag,th.sag{text-align:right}
.th-sira{all:unset;cursor:pointer;font:inherit;font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:800;color:inherit}
.th-sira.on{color:var(--accent)}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--surface-2)}

/* çekmece */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:5;overflow:auto;overscroll-behavior:contain;padding:16px;box-shadow:-12px 0 30px rgba(10,20,50,.16);display:flex;flex-direction:column;gap:12px;transition:width .18s ease}
.drawer.genis{width:calc(100% - 232px)}
.drawer[hidden]{display:none}
.drawer h4{margin:0;font-size:18px;line-height:1.25}
.dhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.dhead .ust{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-bottom:6px}
.dacts{display:flex;gap:2px;flex:none}
.denetim{margin-top:14px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);padding:8px 10px;background:var(--surface-2);border-radius:8px}
.denetim b{color:var(--fg);font-weight:600}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:7px 10px;font-weight:700;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--fg)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 10px;font-size:13px;align-items:center;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;min-width:0}

/* form */
.form{display:grid;gap:12px}
.form label,.lbl{display:grid;gap:5px;font-weight:700;font-size:12.5px;color:var(--muted)}
.form label>.zaman,.lbl>.zaman{font-weight:400}
/* label olarak yazılan düğmeler (dosya seç vb.) form etiketi gibi alt alta dizilmesin: ikon ve yazı tek satır, kompakt */
.form label.btn,.lbl label.btn,label.btn{display:inline-flex;flex-direction:row;align-items:center;gap:6px;color:var(--fg);font-weight:700;justify-self:start;width:auto;white-space:nowrap}
.form label.btn.sm,label.btn.sm{font-size:12px;padding:4px 9px}
label.btn .ic{width:14px;height:14px;flex:none}
.foto-btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.form input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=file]):not([type=range]),
.form select,.form textarea,
.panel input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=file]),
.panel select,.panel textarea,
.box input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=file]),
.box select,.box textarea,
.lbl input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=file]):not([type=range]),
.lbl select,.lbl textarea{
  font:inherit;font-size:14px;font-weight:400;color:var(--fg);line-height:1.4;
  width:100%;box-sizing:border-box;min-width:0;
  padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--inp)}
.form textarea,.panel textarea,.box textarea,.lbl textarea{padding:10px;min-height:96px;line-height:1.55;resize:vertical}
.form input[type=color],.panel input[type=color],.box input[type=color],.lbl input[type=color]{width:36px;height:36px;padding:0;border-radius:8px;border:1px solid var(--line);background:var(--inp);cursor:pointer}
.form input[type=color]::-webkit-color-swatch-wrapper,.lbl input[type=color]::-webkit-color-swatch-wrapper{padding:3px}
.form input[type=color]::-webkit-color-swatch,.lbl input[type=color]::-webkit-color-swatch{border:none;border-radius:5px}
.form input[type=checkbox],.form input[type=radio],.panel input[type=checkbox],.lbl input[type=checkbox],.tbl input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.form label:has(> input[type=checkbox]),.form label:has(> input[type=radio]),.panel label:has(> input[type=checkbox]){display:flex;flex-direction:row;align-items:center;gap:8px;font-weight:600;color:var(--fg);font-size:13px}
.form input:focus,.form select:focus,.form textarea:focus,
.panel input:focus,.panel select:focus,.panel textarea:focus,
.box input:focus,.box select:focus,.box textarea:focus,
.lbl input:focus,.lbl select:focus,.lbl textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.form input:disabled,.form select:disabled,.form textarea:disabled,.panel input:disabled,.panel select:disabled{opacity:.6;cursor:not-allowed}
fieldset.salt{border:0;padding:0;margin:0;min-width:0;display:grid;gap:5px}
.tbl select,.tbl input:not([type=checkbox]){font:inherit;font-size:13px;font-weight:500;color:var(--fg);width:100%;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--inp)}
.tbl select:focus,.tbl input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.etiketler{display:flex;flex-wrap:wrap;gap:6px}
.etag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;line-height:1;color:#fff;background:var(--c,#2b62e3);border-radius:999px;padding:4px 10px}
.etag:has(button){padding-right:4px}
.etag button{all:unset;cursor:pointer;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:13px;line-height:1;background:color-mix(in srgb,#fff 28%,transparent)}
.etag button:hover{background:color-mix(in srgb,#fff 48%,transparent)}
.form .etiket-ekle{display:flex;align-items:center;gap:8px;position:relative}
.renk-sec{flex:none;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:6px;cursor:pointer}
.renk-sec::before{content:"";display:block;width:100%;height:100%;border-radius:5px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.renk-sec:hover,.renk-sec[aria-expanded=true]{border-color:var(--brand)}
.palet-pop[hidden]{display:none!important}
.palet-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.form .etiket-ekle input:not([type=color]){flex:1 1 auto;width:auto;min-width:0;height:36px}
.form .etiket-ekle input[type=color]{flex:none}
.form .etiket-ekle .btn{flex:none;height:36px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.adres{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.adres .tam{grid-column:1 / -1}
.sayi-kisa{max-width:140px}
.puan{display:flex;align-items:center;gap:2px;flex-wrap:wrap}.puan-y{border:0;background:none;padding:2px;font-size:24px;line-height:1;color:var(--line,#c9cdd6);cursor:pointer}.puan-y.on{color:#f5b301}.puan-y:hover{transform:scale(1.15)}.puan-n{margin-left:8px}
.ep-imza{display:grid;gap:6px}.ep-imza-on{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);font-size:13px;max-height:220px;overflow:auto}.ep-imza-on img{max-width:100%;height:auto}
.gd-sih ol{margin:8px 0 6px 18px;padding:0;display:grid;gap:10px;font-size:13px}.gd-sih li{line-height:1.5}
.gd-adres{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}.gd-adres code{background:var(--surface-2);padding:5px 8px;border-radius:6px;font-size:12px;word-break:break-all}
.gd-yardim{margin-top:6px;font-size:12.5px}.gd-yardim summary{cursor:pointer;color:var(--brand);font-weight:600}.gd-yardim p{margin:6px 0;color:var(--muted)}
.gd-kisisel{border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
.gd-liste{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.aralik{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:420px}.aralik label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.fiyat{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px;max-width:420px}
.box{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px;background:var(--bg)}
.mali-bas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mali-bas .tam{grid-column:1 / -1}
.mali-tablo{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.mali-tablo table{width:100%;border-collapse:collapse}
.mali-tablo th,.mali-tablo td{padding:5px 6px;vertical-align:middle}
.mali-tablo input,.mali-tablo select{min-width:0;width:100%}
.mali-tablo td:nth-child(4) select{min-width:78px}
.mali-toplam{display:flex;justify-content:flex-end;gap:8px;font-weight:800;font-size:13px}
.yuzde{display:flex;align-items:center;gap:10px}
.yuzde input{max-width:110px}
.bar{flex:1;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:999px}
.bar.ok i{background:var(--ok)}.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.imza{display:grid;gap:6px}
.imza canvas{width:100%;max-width:460px;height:150px;border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair}
.konum{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.konum input{flex:1;min-width:160px}
.anahtar{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--fg);font-size:13px;cursor:pointer}
.content>.btn,.drawer>.btn,.form>.btn,.panel>.btn{align-self:flex-start;justify-self:start}
.form .anahtar,.anahtar{display:inline-flex!important;flex-direction:row!important;align-items:center;gap:8px;width:max-content}
.form .anahtar input[type=checkbox],.anahtar input[type=checkbox]{width:34px!important;height:20px!important;flex:none;}
.anahtar input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s}
.anahtar input::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.anahtar input:checked{background:var(--accent)}
.anahtar input:checked::after{transform:translateX(14px)}
.liste{display:grid;gap:8px}
.kutular{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.kutular .sec{width:190px;flex:none}
.kutular .sp{flex:1;min-width:0}
.kutular .sec b,.kutular .sec .zaman{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:inherit}
.liste .sec .sp,.kutular .sec .sp{display:grid;gap:2px;flex:1;min-width:0}
.sec .zaman{font-size:11.5px}
.sec.pasif{opacity:.55}
.oniz{pointer-events:none;max-width:320px;margin-top:4px}
.oniz select{font:inherit;font-size:13px;color:var(--fg);width:100%;padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--inp)}
.secim{display:flex;flex-wrap:wrap;gap:6px 14px}
.secim label{display:flex;flex-direction:row;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--fg)}
.sec:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.sec.on{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent)}
.sec[draggable="true"]{cursor:grab}
.sec.over,.bl.over{outline:2px dashed var(--accent);outline-offset:-3px}
.sec b{display:block;font-size:13.5px}
.nokta{width:14px;height:14px;border-radius:4px;background:var(--c);flex:none}
.ikonlar{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:4px}
.ikonlar button{all:unset;cursor:pointer;height:34px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.ikonlar button:hover{color:var(--fg);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.ikonlar button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

/* zengin metin */
.zk{border:1px solid var(--line);border-radius:8px;background:var(--inp);overflow:hidden;font-weight:400}
.zk:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.zbar{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:4px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.zb{min-width:28px;height:28px;padding:0 6px;border:0;border-radius:6px;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-grid;place-items:center}
.zb:hover{background:var(--surface);color:var(--fg)}
.zb.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.zb .ic{width:15px;height:15px}
.zsel{width:auto;height:28px;max-width:128px;padding:0 4px;border:1px solid var(--line);border-radius:6px;background:var(--inp);color:var(--fg);font:inherit;font-size:12px;font-weight:400}
.form .zk .zsel,.zk .zsel{width:auto;min-height:0;padding:0 4px;font-size:12px;font-weight:400;box-shadow:none}
.zed{min-height:160px;max-height:360px;overflow:auto;padding:10px 12px;outline:none;font-size:14px;font-weight:400;color:var(--fg);line-height:1.6}
.zed:empty:before{content:attr(data-ph);color:var(--ph)}
.zed a,.zgos a{color:var(--accent)}
.zed table,.zgos table{border-collapse:collapse;width:100%;margin:6px 0}
.zed,.zgos{overflow-x:auto}
.zed td,.zed th{word-break:break-word}
.zed td,.zed th,.zgos td,.zgos th{border:1px solid var(--line);padding:4px 6px;min-width:28px;vertical-align:top;text-transform:none;letter-spacing:0;font-size:13px;color:var(--fg);background:transparent}
.zed img,.zgos img{max-width:100%;height:auto;border-radius:6px}
.zed img{cursor:pointer}.zed img.zsecili{outline:3px solid var(--brand);outline-offset:2px}
.zb-sil{color:var(--bad,#cf3640)}.zayir{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.zgos{font-size:14px;font-weight:400;color:var(--fg);line-height:1.6}
.form textarea.zk-src{display:none}

/* diğer */
.rowbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dal{margin-left:14px;border-left:2px solid var(--line);padding-left:10px}
.agac-sat{display:grid;gap:6px;padding:6px 0}
.zaman,.small{color:var(--muted);font-size:11.5px;font-weight:400}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:9px 12px;border-radius:0 8px 8px 0;font-size:13px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.tabs2{display:flex;gap:6px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px}
.panel h4{margin:0;font-size:15px}
.ornekler{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.ornek{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:8px;align-content:start}
.ornek h4{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.ornek h4 .ic{color:var(--muted)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:90;font-weight:600;font-size:13px;max-width:min(520px,92vw);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.print-tablo{display:none}
.empty{color:var(--muted);padding:18px;text-align:center;font-size:12.5px}

/* panolar */
.pano-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bl{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.bl.tam{grid-column:1 / -1}
.bl>h4{margin:0;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.bl>h4 .ic{color:var(--muted)}
.bl>h4 .n{color:var(--muted);font-weight:700}
.bl>p.zaman{margin:-8px 0 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:4px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.kpi:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.kpi span{color:var(--muted);font-weight:700;font-size:12px}
.kpi b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi b.bad{color:var(--bad)}
.kpi small{color:var(--muted);font-size:11.5px}
.teslimler{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.teslim{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:2px;cursor:pointer;background:var(--surface)}
.teslim:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.teslim .ust{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted)}
.teslim .gun-n{font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.teslim .gun-n small{font-size:12px;font-weight:700;margin-left:4px}
.teslim .gun-n.yakin{color:var(--bad)}
.teslim .gun-n.orta{color:var(--warn)}
.teslim .gun-n.gec{color:var(--bad)}
.teslim b{font-size:13px}
.dag{display:grid;gap:10px}
.dag-sat{display:grid;grid-template-columns:140px minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:12.5px}
.dag-bar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.dag-bar i{display:block;height:100%;background:var(--c)}
.lejant{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}
.lejant span{display:inline-flex;align-items:center;gap:5px}
.lejant i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.msg{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;align-items:flex-start}
.msg:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.msg.yeni{border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 4%,var(--surface))}
.msg .ic-m{flex:1;min-width:0;display:grid;gap:2px}
.msg .ic-m p{margin:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}


/* kompakt kişi seçici */
.kisec{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-weight:400}
.kisec .kc{display:inline-flex;align-items:center;gap:4px;padding:1px 3px 1px 1px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:600;color:var(--fg);background:var(--surface)}
.kisec .kc .av{width:20px;height:20px;font-size:8.5px}
.kisec .kc button{all:unset;cursor:pointer;width:16px;height:16px;display:grid;place-items:center;border-radius:50%;color:var(--muted);font-size:13px;line-height:1}
.kisec .kc button:hover{background:var(--bad-soft);color:var(--bad)}
.lbl .kisec select.mini,.form .kisec select.mini{width:auto!important;padding:2px 8px!important;font-size:12px!important;border-radius:999px!important;border-style:dashed!important;color:var(--accent)!important;background:transparent!important}
/* karar ağacı */
.agac{display:grid;gap:1px;font-weight:400}
.ag-ozet{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:4px}
.ag-ozet .bar{max-width:180px}
.ag-sat{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:6px;min-width:0}
.ag-sat>*{flex-shrink:1;min-width:0}
.ag-sat>input[type=checkbox],.ag-sat>.ibtn{flex:none}
.drawer{overflow-x:hidden}
.drawer .form,.drawer .lbl{min-width:0}
.ag-sat:hover{background:var(--surface-2)}
.lbl .ag-sat input.ag-m,.form .ag-sat input.ag-m{flex:1 1 90px;min-width:0!important;border-color:transparent!important;background:transparent!important;padding:4px 6px!important;font-size:13px!important}
.lbl .ag-sat input.ag-m:focus{background:var(--inp)!important;border-color:var(--accent)!important}
.ag-sat.tamam input.ag-m{text-decoration:line-through;color:var(--muted)!important}
.lbl .ag-sat select{width:96px!important;flex:0 1 96px;}
.lbl .ag-sat input[type=date]{width:116px!important;flex:0 1 116px;}
.lbl .ag-sat select,.lbl .ag-sat input[type=date]{padding:2px 6px!important;font-size:12px!important;border-color:transparent!important;background:transparent!important;color:var(--muted)!important}
.lbl .ag-sat select:hover,.lbl .ag-sat input[type=date]:hover{border-color:var(--line)!important}
.ag-sat .ibtn.sm{opacity:0}
.ag-sat:hover .ibtn.sm,.ag-sat:focus-within .ibtn.sm{opacity:1}
.ag-ic{margin-left:12px;padding-left:12px;border-left:1px dashed var(--line)}
/* mesajlar */
.sohbet{display:grid;gap:10px;max-height:440px;overflow:auto;padding:4px 2px;font-weight:400}
.bal{display:flex;gap:8px;align-items:flex-start}
.bal.ben{flex-direction:row-reverse}
.bal .gov{display:grid;gap:2px;max-width:85%;min-width:0}
.bal.ben .gov{justify-items:end}
.bal .ust{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.bal .ust b{color:var(--fg)}
.bal .kutu{background:var(--surface-2);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:8px 11px;font-size:13.5px;color:var(--fg);white-space:pre-wrap;word-break:break-word;line-height:1.5}
.bal.ben .kutu{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent);border-radius:12px 4px 12px 12px}
.bal .alinti{border-left:3px solid var(--accent);padding:2px 8px;margin-bottom:6px;font-size:12px;color:var(--muted);white-space:normal;background:color-mix(in srgb,var(--surface) 60%,transparent);border-radius:0 6px 6px 0}
.bal .ekler{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bal .ekler img{width:120px;height:90px;object-fit:cover;border-radius:8px;cursor:zoom-in;display:block}
.bal .eyl{display:flex;gap:2px}
.bal .eyl button{all:unset;cursor:pointer;font-size:11.5px;color:var(--muted);padding:1px 6px;border-radius:6px}
.bal .eyl button:hover{color:var(--accent);background:var(--accent-soft)}
.bal.yanitta .kutu{box-shadow:0 0 0 2px var(--accent)}
.yazici{border:1px solid var(--line);border-radius:12px;background:var(--inp);overflow:hidden;font-weight:400}
.yazici:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.lbl .yazici textarea{border:0!important;box-shadow:none!important;min-height:64px!important;background:transparent!important;border-radius:0!important}
.yz-alinti{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
.yz-alinti b{color:var(--accent)}
.yz-ekler{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 8px}
.yz-ekler span{position:relative}
.yz-ekler img{height:56px;border-radius:6px;display:block}
.yz-ekler button{all:unset;cursor:pointer;position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;font-size:12px}
.yz-bar{display:flex;gap:6px;align-items:center;padding:6px 8px;border-top:1px solid var(--line);background:var(--surface-2)}
.yz-b{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:9px;color:#fff;background:var(--c);font-size:16px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.yz-b:hover{filter:brightness(1.1)}
.yz-b .ic{width:16px;height:16px}
.yz-b{position:relative}.yz-say{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:8px;background:var(--bad,#cf3640);color:#fff;font:600 10px/16px system-ui;text-align:center;font-style:normal}
.yz-alici{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;border-top:1px solid var(--line)}
.alici-cip{display:inline-flex;align-items:center;gap:5px;padding:2px 4px 2px 2px;border-radius:999px;background:var(--surface-2);font-size:12px}.alici-cip .av{width:20px;height:20px;font-size:9px}.alici-cip button{all:unset;cursor:pointer;padding:0 4px;color:var(--muted)}
.alici-pop{display:grid;gap:4px;max-height:220px;overflow:auto;padding:8px;border-top:1px solid var(--line);background:var(--surface)}
.alici-ok{color:var(--muted);font-size:11px;margin-left:6px}
.emoji-pop{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;padding:8px;border-top:1px solid var(--line);background:var(--surface)}
.emoji-pop button{all:unset;cursor:pointer;font-size:19px;text-align:center;border-radius:6px;padding:3px 0}
.emoji-pop button:hover{background:var(--surface-2)}
/* renk paleti */
.palet{display:grid;grid-template-columns:repeat(8,24px);gap:5px}
.palet label{width:24px;height:24px;border-radius:6px;background:var(--c);cursor:pointer;display:block;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.palet input{position:absolute;opacity:0;pointer-events:none}
.palet label:has(input:checked){outline:2px solid var(--fg);outline-offset:2px}
/* tarih akışı ve kayıt ağacı */
.akis{display:grid}
.ak-gun{display:grid;grid-template-columns:92px 20px minmax(0,1fr);gap:6px}
.ak-tarih{font-size:12px;font-weight:800;text-align:right;padding-top:7px;line-height:1.2}
.ak-tarih small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.ak-gun.bugun .ak-tarih{color:var(--accent)}
.ak-gun.gecmis .ak-tarih{color:var(--muted)}
.ak-cizgi{position:relative}
.ak-cizgi::before{content:'';position:absolute;left:9px;top:0;bottom:0;width:2px;background:var(--line)}
.ak-cizgi i{position:absolute;left:3px;top:9px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.ak-gun.gecmis .ak-cizgi i{border-color:var(--muted)}
.ak-ogeler{display:grid;gap:6px;padding:3px 0 14px}
.ak-oge{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;padding:6px 10px;font-size:12.5px;background:var(--surface);cursor:pointer;display:grid;gap:1px}
.ak-oge:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));border-left-color:var(--c)}
.ak-oge b{font-size:12.5px}
.ak-oge span{color:var(--muted);font-size:11.5px}
.kagac,.kagac ul{list-style:none;margin:0;padding:0}
.kagac ul{padding-left:20px;margin-left:10px;border-left:1.5px solid var(--line)}
.kagac li{position:relative;padding:4px 0 4px 12px}
.kagac ul>li::before{content:'';position:absolute;left:-1.5px;top:17px;width:12px;border-top:1.5px solid var(--line)}
.dug{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;max-width:100%}
.dug.kok{background:var(--accent-soft);border-color:var(--accent);font-weight:800}
.dug.mod{border-left:4px solid var(--c);font-weight:700}
.dug.kyt{cursor:pointer}
.dug.kyt:hover{border-color:var(--accent)}
.dug.not{background:var(--surface-2);font-weight:400;color:var(--fg);border-style:dashed}
/* önizleme */
#onizle:empty{display:none}
.onizle{position:fixed;inset:0;background:rgba(8,12,28,.62);z-index:80;display:grid;place-items:center;padding:24px}
.onizle .pen{background:var(--surface);border-radius:12px;width:min(1100px,100%);height:min(88vh,920px);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.onizle .pb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.onizle .pb .ad{flex:1;min-width:0;display:grid}
.onizle .pb .ad b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.onizle .gov{display:grid;grid-template-columns:minmax(0,1fr) 260px;min-height:0}
.onizle .alan{display:grid;place-items:center;background:var(--bg);overflow:auto;min-height:0}
.onizle .alan iframe{width:100%;height:100%;border:0;background:#fff}
.onizle .alan img{max-width:100%;max-height:100%;object-fit:contain}
.onizle .bos{padding:30px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center;max-width:420px}
.onizle .yan{border-left:1px solid var(--line);padding:14px;display:grid;gap:12px;align-content:start;overflow:auto}
.gorunum-tbl td,.gorunum-tbl th{padding:7px 10px;vertical-align:middle}
.gorunum-tbl td:nth-child(n+2),.gorunum-tbl th:nth-child(n+2){text-align:center;width:70px}
.stok-uyari{color:var(--bad);font-weight:700}
@media(max-width:800px){.onizle .gov{grid-template-columns:1fr}.onizle .yan{display:none}}
@media(max-width:900px){.pano-grid{grid-template-columns:1fr}.bl.tam{grid-column:auto}.dag-sat{grid-template-columns:100px minmax(0,1fr) 30px}}
@media(max-width:800px){
  .menu-btn{display:grid}
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(280px,88vw);z-index:30;transform:translateX(-105%);transition:transform .18s}
  .app.menu .side{transform:none}
  .drawer,.drawer.genis{width:100%}
  .two,.mali-bas{grid-template-columns:1fr}
}
@media print{
  .side,.topbar,.drawer,.toast,.filters,.no-print{display:none!important}
  .app{display:block;height:auto}
  .print-tablo{display:block}
  .board,.tbl{display:none}
  body{background:#fff;color:#000}
}

/* ---------- departman ---------- */
.dep-panel{margin-bottom:12px}
.dep-cipler{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dep-cip{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);font-weight:600;font-size:12.5px}
.dep-cip em{font-style:normal;color:var(--muted);font-weight:500}
.dep-cip button{border:0;background:none;padding:2px;border-radius:50%;color:var(--muted);display:inline-flex}
.dep-cip button:hover{background:var(--bad-soft);color:var(--bad)}
.dep-cip .ic{width:12px;height:12px}
.kiosk-url{display:flex;gap:6px}.kiosk-url input{flex:1;min-width:0;font-family:var(--f-mono);font-size:11.5px}
/* ---------- kiosk ---------- */
#kiosk[hidden]{display:none}
.kiosk{--ko:1;position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);background:var(--bg);color:var(--fg);font-size:calc(1.55vh*var(--ko));overflow:hidden;cursor:default;outline:0}
.kiosk .ic{width:1.1em;height:1.1em}
.kiosk .mono{font-family:var(--f-mono)}
.kiosk .sp{flex:1}
.ko-ust{display:flex;align-items:center;gap:1.2em;padding:1em 1.6em;border-bottom:1px solid var(--line);background:var(--surface)}
.ko-marka{display:flex;align-items:center;gap:.7em;min-width:0}
.ko-marka img,.ko-logo-y{width:2.8em;height:2.8em;border-radius:.5em;object-fit:contain;flex:none}
.ko-logo-y{display:grid;place-items:center;background:var(--brand);color:#fff}.ko-logo-y .ic{width:1.5em;height:1.5em}
.ko-marka>span{display:grid;line-height:1.15}.ko-marka b{font-size:1.25em;font-weight:800;letter-spacing:.01em;white-space:nowrap}.ko-marka small{color:var(--muted);font-size:.85em;white-space:nowrap}
.ko-ayrac{width:1px;align-self:stretch;background:var(--line);margin:0 .2em}
.ko-bas{display:inline-flex;align-items:center;gap:.5em;font-size:1.7em;font-weight:800;letter-spacing:-.01em}
.ko-bas small{font-size:.5em;color:var(--muted);font-weight:600;margin-left:.3em;font-family:var(--f-mono)}
.ko-kapsam{padding:.25em .8em;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.ko-nok{display:flex;gap:.4em}.ko-nok i{width:.6em;height:.6em;border-radius:50%;background:var(--line)}.ko-nok i.on{background:var(--accent);width:1.6em;border-radius:1em}
.ko-saat{display:grid;text-align:right;font-family:var(--f-mono);font-size:2em;font-weight:700;line-height:1}.ko-saat small{font-family:var(--f);font-size:.38em;color:var(--muted);font-weight:500;margin-top:.3em}
.ko-ses{display:inline-flex;align-items:center;gap:.4em;border:0;border-radius:999px;padding:.4em .9em;background:var(--warn);color:#111;font-weight:800;font-size:.9em;animation:ko-nabiz 1.4s ease-in-out infinite}
.ko-dur{padding:.3em .8em;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-weight:800;font-size:.85em}
.ko-govde{padding:1.4em 1.6em;overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:1em}
.ko-alt{display:flex;align-items:center;gap:1em;padding:.55em 1em .55em 1.6em;border-top:1px solid var(--line);background:var(--surface);font-size:1.05em;min-height:3.6em}
.ko-kayan{flex:1;display:flex;align-items:center;gap:.8em;min-width:0;color:var(--warn);font-weight:800;font-size:1.9em;letter-spacing:.01em}
.ko-kayan>div{flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.ko-kayan span{display:inline-block;padding-left:100%;animation:ko-kayan 34s linear infinite}
.ko-canli{display:inline-flex;align-items:center;gap:.5em;color:var(--muted);font-family:var(--f-mono);font-size:.85em;white-space:nowrap}
.ko-canli i{width:.6em;height:.6em;border-radius:50%;background:var(--ok);animation:ko-nabiz 2s ease-in-out infinite}
.ko-ilerle{position:fixed;left:0;right:0;bottom:0;height:.3em;background:transparent}.ko-ilerle i{display:block;height:100%;width:0;background:var(--accent)}
.kiosk.dur .ko-ilerle i{animation-play-state:paused!important}
.ko-ipucu{position:fixed;right:1.6em;bottom:5em;padding:.5em .9em;border-radius:6px;background:var(--surface-2);color:var(--muted);font-size:.85em;transition:opacity .6s}.ko-ipucu.gizle{opacity:0}
.ko-bos{margin:auto;display:grid;justify-items:center;gap:.5em;text-align:center;color:var(--muted)}
.ko-bos .ic{width:4em;height:4em}.ko-bos b{font-size:2.4em;color:var(--fg)}.ko-bos span{font-size:1.2em;max-width:40em}
.ko-bos.ok .ic,.ko-bos.ok b{color:var(--ok)}
.ko-not{margin:0;color:var(--muted);font-size:1.1em}
@keyframes ko-ilerle{from{width:0}to{width:100%}}
@keyframes ko-kayan{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@keyframes ko-nabiz{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ko-yan{0%,100%{box-shadow:0 0 0 .2em var(--bad)}50%{box-shadow:0 0 0 .2em transparent}}
/* geri sayım */
.kg-izgara{flex:1;display:grid;gap:1em;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;min-height:0}
.kg-izgara.n1{grid-template-columns:1fr}.kg-izgara.n2{grid-template-columns:repeat(2,1fr)}.kg-izgara.n3{grid-template-columns:repeat(3,1fr)}.kg-izgara.n4{grid-template-columns:repeat(4,1fr)}
.kg-izgara.n5,.kg-izgara.n6{grid-template-columns:repeat(3,1fr)}
.kg{--c:var(--ok);display:flex;flex-direction:column;gap:.2em;padding:1em 1.2em;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-top:.45em solid var(--c);min-height:0;overflow:hidden}
.kg.sar{--c:var(--warn)}.kg.kir,.kg.gec{--c:var(--bad)}
.kg.gec{background:var(--bad-soft);animation:ko-yan 1.6s ease-in-out infinite}
.kg-ust{display:flex;justify-content:space-between;color:var(--muted);font-weight:600}
.kg-n{font-size:6em;font-weight:900;line-height:.95;color:var(--c);font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin-top:auto}
.kg-izgara.n1 .kg-n,.kg-izgara.n2 .kg-n{font-size:16em}.kg-izgara.n3 .kg-n,.kg-izgara.n4 .kg-n{font-size:11em}.kg-izgara.n5 .kg-n,.kg-izgara.n6 .kg-n{font-size:7.5em}
.kg-izgara.n1 .kg-e,.kg-izgara.n2 .kg-e,.kg-izgara.n3 .kg-e,.kg-izgara.n4 .kg-e{font-size:1.6em}
.kg-e{font-weight:800;color:var(--c);letter-spacing:.06em;font-size:1.05em}
.kg-ad{font-size:1.45em;line-height:1.2;margin-top:auto;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kg-alt{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kg-alt2{display:flex;align-items:center;gap:.6em;margin-top:.3em}
.kg-d{padding:.15em .6em;border-radius:5px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--fg);font-weight:700;font-size:.85em;white-space:nowrap}
.kg-bar{flex:1;height:.55em;border-radius:1em;background:var(--surface-2);overflow:hidden;min-width:3em}.kg-bar i{display:block;height:100%;background:var(--accent);border-radius:1em}
/* ekip panosu */
.ke-ozet{display:flex;gap:2em;font-size:1.25em;color:var(--muted)}.ke-ozet b{font-size:1.6em;color:var(--fg);margin-right:.25em}.ke-ozet .bad b{color:var(--bad)}.ke-ozet .ok b{color:var(--ok)}
.ke-kolonlar{flex:1;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:1em;min-height:0}
.ke-kol{display:flex;flex-direction:column;gap:.6em;background:var(--surface-2);border-radius:12px;padding:.8em;min-height:0;overflow:hidden}
.ke-bas{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:1.2em;padding:.1em .2em .4em;border-bottom:.2em solid var(--c)}
.ke-bas b{background:var(--c);color:#fff;border-radius:999px;padding:0 .6em;font-size:.95em}
.ke-kart{background:var(--surface);border:1px solid var(--line);border-left:.35em solid var(--accent);border-radius:8px;padding:.6em .8em;display:grid;gap:.4em}
.ke-kart.gec{border-left-color:var(--bad);background:var(--bad-soft)}
.ke-t b{font-size:1.15em;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ke-acil{display:inline-block;background:var(--bad);color:#fff;font-weight:800;font-size:.7em;padding:.1em .5em;border-radius:4px;margin-right:.4em;vertical-align:middle}
.ke-alt{display:flex;align-items:center;gap:.5em;color:var(--muted)}.ke-alt .av{width:1.8em;height:1.8em;font-size:.75em}
.ke-trh{font-family:var(--f-mono);font-weight:700}.ke-kart.gec .ke-trh{color:var(--bad)}
.ke-daha{color:var(--muted);text-align:center;font-weight:700}
/* proje durumu */
.kp-liste{display:grid;gap:.7em}
.kp-satir{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,3fr) minmax(0,1.2fr) repeat(3,minmax(0,.8fr));gap:1.2em;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.8em 1.2em}
.kp-ad{display:grid;min-width:0}.kp-ad .mono{color:var(--muted);font-size:.9em}.kp-ad b{font-size:1.35em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kp-ad small{color:var(--muted)}
.kp-akis{display:flex;align-items:center}
.kp-adim{flex:1;position:relative;display:flex;align-items:center;height:2.6em}
.kp-adim::before{content:"";position:absolute;left:0;right:0;top:50%;height:.25em;background:var(--line);transform:translateY(-50%)}
.kp-adim i{position:relative;width:1em;height:1em;border-radius:50%;background:var(--surface);border:.2em solid var(--line);z-index:1}
.kp-adim.gecti::before,.kp-adim.su::before{background:var(--c)}.kp-adim.gecti i{background:var(--c);border-color:var(--c)}
.kp-adim.su i{width:1.5em;height:1.5em;background:var(--c);border-color:var(--surface);box-shadow:0 0 0 .2em var(--c)}
.kp-adim em{position:absolute;left:0;top:-.2em;font-style:normal;font-weight:800;font-size:.85em;white-space:nowrap;transform:translateY(-60%)}
.kp-y{display:flex;align-items:center;gap:.5em}.kp-y b{font-family:var(--f-mono)}
.kp-n{display:grid;text-align:center}.kp-n b{font-size:1.8em;line-height:1;font-variant-numeric:tabular-nums}.kp-n small{color:var(--muted);font-size:.8em}
.kp-n.bad b{color:var(--bad)}.kp-n.warn b{color:var(--warn)}
/* stok */
.kst-liste{display:grid;gap:.8em}
.kst{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr) auto;gap:1.5em;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1em 1.4em}
.kst b{font-size:1.4em}.kst small{display:block;color:var(--muted)}
.kst .kg-bar{height:1em}.kst.dusuk .kg-bar i{background:var(--bad)}
.kst-n{text-align:right}.kst-n b{font-size:2.6em;font-variant-numeric:tabular-nums}.kst.dusuk .kst-n b{color:var(--bad)}
.kst.dusuk{border-left:.4em solid var(--bad)}
/* mesaj */
.km-liste{display:grid;gap:.8em}
.km{display:flex;gap:1em;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.9em 1.2em}
.km .av{width:2.6em;height:2.6em;font-size:1em;flex:none}
.km-g{flex:1;min-width:0}.km-u{display:flex;gap:.8em;align-items:baseline;color:var(--muted)}.km-u b{color:var(--fg);font-size:1.15em}
.km p{margin:.2em 0 0;font-size:1.35em;line-height:1.35}
/* durgun */
.kd-liste{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1em}
.kd{display:flex;gap:1.2em;align-items:center;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:12px;padding:1em 1.3em}
.kd.cok{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.kd-n{display:grid;text-align:center;min-width:4.5em}.kd-n b{font-size:3.6em;line-height:1;color:var(--warn);font-weight:900}.kd.cok .kd-n b{color:var(--bad)}.kd-n small{font-weight:800;letter-spacing:.1em;color:var(--muted)}
.kd-g{display:grid;gap:.15em;min-width:0}.kd-g .mono{color:var(--muted)}.kd-g b{font-size:1.45em}.kd-g small{color:var(--muted);font-size:.95em}
/* sayaç */
.ks-izgara{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:1.2em}
.ks-k{display:grid;align-content:center;justify-items:center;gap:.2em;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--muted)}
.ks-k .ic{width:2.2em;height:2.2em}
.ks-k b{font-size:6em;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums}
.ks-k span{font-size:1.4em;font-weight:700}
.ks-k.ok b,.ks-k.ok .ic{color:var(--ok)}.ks-k.bad b,.ks-k.bad .ic{color:var(--bad)}.ks-k.warn b,.ks-k.warn .ic{color:var(--warn)}
.ks-k.bad{background:var(--bad-soft)}
/* duyuru */
.kdu{margin:auto;display:grid;justify-items:center;gap:1em;text-align:center;max-width:80%}
.kdu .ic{width:5em;height:5em;color:var(--warn)}.kdu p{font-size:3.4em;font-weight:800;line-height:1.2;margin:0}
/* departman iş durumu */
.kdp-liste{display:grid;gap:.8em}
.kdp{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(4,minmax(0,1fr));align-items:center;gap:1em;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.9em 1.4em}
.kdp-ad{display:grid;grid-template-columns:auto 1fr;column-gap:.6em;align-items:center}.kdp-ad .ic{width:2em;height:2em;grid-row:span 2;color:var(--accent)}.kdp-ad b{font-size:1.6em}.kdp-ad small{color:var(--muted)}
.kdp-n{display:grid;text-align:center}.kdp-n b{font-size:3em;line-height:1;font-variant-numeric:tabular-nums}.kdp-n small{color:var(--muted);font-weight:700;font-size:.95em}
.kdp-n.bad b{color:var(--bad)}.kdp-n.warn b{color:var(--warn)}.kdp-n.acc b{color:var(--accent)}
/* kullanım */
.ku-izgara{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1.6em;min-height:0}.ku-izgara.tek{grid-template-columns:minmax(0,60%);justify-content:center}
.ku-kol{display:flex;flex-direction:column;gap:.8em}
.ku-kol h3{display:flex;align-items:center;gap:.5em;margin:0;font-size:1.6em}.ku-kol h3 .ic{width:1.2em;height:1.2em}.ku-kol h3.cok{color:var(--ok)}.ku-kol h3.az{color:var(--warn)}
.ku{display:flex;align-items:center;gap:1.1em;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.9em 1.2em}
.ku-sira{font-size:1.8em;font-weight:900;color:var(--muted);width:1.2em;text-align:center}
.ku-foto{width:5.2em;height:5.2em;border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:1.2em}
img.ku-foto{font-size:1em}
.ku.cok .ku-foto{box-shadow:0 0 0 .2em var(--ok)}.ku.az .ku-foto{box-shadow:0 0 0 .2em var(--warn)}
.ku-g{flex:1;display:grid;min-width:0}.ku-g b{font-size:1.5em}.ku-g small{color:var(--muted)}.ku-d{color:var(--muted);font-size:.9em;margin-top:.2em}
.ku-n{display:grid;text-align:center}.ku-n b{font-size:2.8em;line-height:1}.ku.cok .ku-n b{color:var(--ok)}.ku.az .ku-n b{color:var(--warn)}.ku-n small{color:var(--muted)}
/* galeri */
.kgl{position:relative;flex:1;margin:-1.4em -1.6em;overflow:hidden;background:#000;animation:kgl-gir 1s ease-out}
.kgl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kgl-zoom 12s ease-out forwards}
.kgl-alt{position:absolute;left:0;right:0;bottom:0;padding:3em 2.4em 1.6em;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;display:grid;gap:.2em}
.kgl-alt b{font-size:2.6em;line-height:1.1}.kgl-alt span{font-size:1.3em;opacity:.85}
.kgl-kapak{flex:1;display:grid;place-content:center;justify-items:center;gap:.4em;text-align:center;animation:kgl-gir 1s ease-out}
.kgl-kapak b{font-size:7em;font-weight:900;letter-spacing:-.02em;line-height:1;background:linear-gradient(90deg,var(--fg),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.kgl-kapak span{font-size:1.8em;color:var(--muted)}
@keyframes kgl-gir{from{opacity:0}to{opacity:1}}
@keyframes kgl-zoom{from{transform:scale(1)}to{transform:scale(1.08)}}
/* geri */
.ko-geri{width:2.2em;height:2.2em;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);display:grid;place-items:center;opacity:.45;flex:none;padding:0}
.ko-geri:hover{opacity:1;color:var(--fg)}.ko-geri .ic{width:1.1em;height:1.1em}
.ibtn.yildiz.on{color:#f5a623}.ibtn.yildiz.on svg{fill:#f5a623}
/* anons */
.ko-anons{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.72);z-index:10}
.ko-anons.on{display:grid;animation:ko-gir .4s ease-out}
.ko-anons>div{--c:var(--accent);display:grid;justify-items:center;gap:.4em;text-align:center;background:var(--surface);border:.3em solid var(--c);border-radius:24px;padding:2.4em 4em;max-width:80vw;box-shadow:0 2em 6em rgba(0,0,0,.5)}
.ko-anons.ok>div{--c:var(--ok)}.ko-anons.alarm>div{--c:var(--bad);animation:ko-yan 1s ease-in-out infinite}.ko-anons.mesaj>div{--c:var(--accent)}
.ko-anons .ic{width:5em;height:5em;color:var(--c)}
.ko-anons b{font-size:4.2em;font-weight:900;color:var(--c);letter-spacing:.02em;line-height:1.05}
.ko-anons p{font-size:2.2em;font-weight:700;margin:0}
.ko-anons span{font-size:1.3em;color:var(--muted)}
@keyframes ko-gir{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}

/* ---------- çıktı formları ---------- */
.ck-ekran{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.ck-liste{display:grid;gap:6px;position:sticky;top:0}
.ck-oge{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px}
.ck-oge:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.ck-oge.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ck-oge span{display:grid;min-width:0}.ck-oge small{color:var(--muted)}
.ck-sag{display:grid;gap:10px;min-width:0}
.ck-par{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.ck-par label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.ck-par select,.ck-par input{height:34px;border:1px solid var(--line);border-radius:6px;background:var(--inp);padding:0 8px;min-width:150px}
.ck-donem{display:flex;gap:6px}
.ck-masa{background:var(--surface-2);border-radius:8px;padding:24px;overflow:auto}
.kagit{background:#fff;color:#111;width:210mm;min-height:297mm;margin:0 auto;padding:16mm 14mm;box-shadow:0 2px 14px rgba(0,0,0,.18);font-family:Arial,"Helvetica Neue",sans-serif;font-size:11pt;line-height:1.45}
.kagit.yatay{width:297mm;min-height:210mm}
.kagit h2{font-size:17pt;margin:0 0 10px;letter-spacing:.02em}.kagit h3{font-size:12.5pt;margin:16px 0 6px}
.kagit p{margin:6px 0}
.kagit table{width:100%;border-collapse:collapse;margin:8px 0}
.kagit th,.kagit td{border:1px solid #999;padding:5px 7px;text-align:left;vertical-align:top}
.kagit th{background:#eef0f4;font-weight:700}
.kagit .sag{text-align:right;font-variant-numeric:tabular-nums}
.kagit tfoot th{background:#e2e6ee}
.kagit img{max-width:100%}.kagit .ck-imza{max-height:70px}
.ck-hata{background:#ffe1e3;color:#b3141f;border:1px dashed #b3141f;border-radius:3px;padding:0 3px;font-family:var(--f-mono);font-size:.85em}
.kagit table.ck-sayfa{width:100%;border-collapse:collapse;margin:0}
.kagit table.ck-sayfa>thead>tr>td,.kagit table.ck-sayfa>tfoot>tr>td,.kagit table.ck-sayfa>tbody>tr>td{border:0;padding:0;background:none}
.kagit .ck-ust{display:flex;align-items:center;gap:12px;padding-bottom:10px;margin-bottom:14px;border-bottom:2px solid #d42a2f}
.kagit .ck-logo{width:46px;height:46px;object-fit:contain;flex:none}
.kagit .ck-logo-y{display:grid;place-items:center;background:#d42a2f;color:#fff;font-weight:800;font-size:16pt;border-radius:6px}
.kagit .ck-firma{display:grid;flex:1;line-height:1.2}.kagit .ck-firma b{font-size:14pt}.kagit .ck-firma span{font-size:8.5pt;color:#666}
.kagit .ck-belge{display:grid;text-align:right;line-height:1.25}.kagit .ck-belge b{font-size:11pt}.kagit .ck-belge span{font-size:9pt;color:#555}
.kagit .ck-alt{display:flex;justify-content:space-between;gap:12px;margin-top:16px;padding-top:6px;border-top:1px solid #bbb;font-size:8pt;color:#666}
.kagit td.ck-icerik{padding:0}
.ck-sorgu{display:grid;gap:8px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;background:var(--surface);margin-bottom:8px}
.ck-sorgu-bas{display:flex;gap:8px;align-items:center}.ck-sorgu-bas input{flex:1;font-family:var(--f-mono);font-weight:700}
.ck-bag{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}.ck-bag>span{padding-bottom:9px;font-weight:800;color:var(--muted)}
#ckYaz{display:none}
.ck-alanlar{display:grid;gap:8px}
.ck-grup b{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.ck-grup>div{display:flex;flex-wrap:wrap;gap:4px 8px}
.ck-alan{display:inline-flex;align-items:center;gap:3px}
.ck-alan input{width:14px;height:14px;margin:0}
.ck-cip{border:1px solid var(--line);background:var(--surface-2);border-radius:5px;padding:2px 7px;font-size:12px;cursor:grab;display:inline-flex;gap:5px;align-items:center}
.ck-cip:hover{border-color:var(--accent);color:var(--accent)}
.ck-cip em{font-style:normal;color:var(--muted);font-size:10px}
.ck-koslar{display:grid;gap:6px}
.ck-kos{display:grid;grid-template-columns:1.3fr 1fr 1.3fr auto;gap:6px;align-items:center}
.ck-kos select,.ck-kos input{min-width:0}
.ck-yardim{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface-2)}
.ck-yardim summary{cursor:pointer;font-weight:700}
.ck-yardim table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
.ck-yardim td{border-top:1px solid var(--line);padding:5px 6px;vertical-align:top}
.ck-yardim td.mono{white-space:nowrap;color:var(--accent);font-size:11.5px}
.ck-sql{white-space:pre;overflow:auto;font-family:var(--f-mono);font-size:11px;background:var(--inp);border:1px solid var(--line);border-radius:6px;padding:10px;margin:8px 0;max-height:320px}
@media (max-width:900px){.ck-ekran{grid-template-columns:1fr}.ck-liste{position:static}}
@media print{
  body.ck-yaz>*:not(#ckYaz){display:none!important}
  body.ck-yaz #ckYaz{display:block}
  body.ck-yaz{background:#fff}
  #ckYaz .kagit{box-shadow:none;margin:0;padding:0;width:auto;min-height:0}
}

/* ---------- kontrol listesi ---------- */
.kt{display:grid;gap:6px}
.kt-sat{display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(0,1fr) auto;gap:6px;align-items:center;padding:4px 6px;border-radius:6px;border-left:3px solid var(--line)}
.kt-sat.kt-uygun-on{border-left-color:var(--ok)}.kt-sat.kt-sorun-on{border-left-color:var(--bad);background:var(--bad-soft)}.kt-sat.kt-yok-on{border-left-color:var(--muted);opacity:.75}
.kt-sat input.kt-m,.kt-sat input.kt-y{min-width:0;height:30px}
.kt-sec{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kt-s{position:relative;cursor:pointer;margin:0!important}
.kt-s input{position:absolute;opacity:0;width:1px;height:1px}
.kt-s span{display:inline-grid;place-items:center;width:30px;height:28px;font-weight:800;color:var(--muted);background:var(--surface)}
.kt-s+.kt-s span{border-left:1px solid var(--line)}
.kt-s input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.kt-uygun input:checked+span{background:var(--ok);color:#fff}
.kt-sorun input:checked+span{background:var(--bad);color:#fff}
.kt-yok input:checked+span{background:var(--muted);color:#fff}
@media (max-width:640px){.kt-sat{grid-template-columns:1fr auto auto}.kt-sat .kt-y{grid-column:1/-1}}

/* ---------- giriş ---------- */
#giris[hidden]{display:none}
.gr{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,color-mix(in srgb,var(--accent) 14%,var(--bg)),var(--bg) 60%)}
.gr-kart{width:min(400px,100%);display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.12)}
.gr-marka{display:flex;align-items:center;gap:12px}.gr-marka img,.gr-logo-y{width:46px;height:46px;border-radius:10px;object-fit:contain}
.gr-logo-y{display:grid;place-items:center;background:var(--brand);color:#fff;font-weight:800;font-size:18px}
.gr-marka .gr-logo-y{color:#fff;font-size:18px}
.gr-marka div{display:grid}.gr-marka b{font-size:17px}.gr-marka span{color:var(--muted);font-size:12px}
.gr-kart h2{margin:6px 0 0;font-size:20px}
.gr-kart label{display:grid;gap:5px;font-weight:600;font-size:13px}
.gr-kart input[type=email],.gr-kart input[type=password],.gr-kart input[type=text]{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--inp)}
.gr-sifre{position:relative;display:block}.gr-sifre input{width:100%;padding-right:42px!important}.gr-sifre .ibtn{position:absolute;right:4px;top:4px}
.gr-satir{display:flex;justify-content:space-between;align-items:center}
.gr-cb{display:flex!important;align-items:center;gap:6px;font-weight:500!important}
.gr-link{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.gr-hata{margin:0;padding:8px 10px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-weight:600;font-size:13px}
.gr-btn{height:42px;justify-content:center;font-size:15px}
.gr-alt{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:11.5px}
.gr-alt select{height:28px;border:1px solid var(--line);border-radius:6px;background:var(--inp);font-size:11.5px;max-width:170px}
/* ---------- profil ---------- */
.side .foot[data-act]{cursor:pointer;border-radius:8px}.side .foot[data-act]:hover{background:rgba(255,255,255,.06)}
.pr-izgara{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:14px;align-items:start}
.pr-bolum h4{display:flex;align-items:center;gap:8px}
.pr-kimlik{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.pr-foto{width:84px;height:84px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:26px;flex:none}
.pr-ep-durum{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--surface-2);margin-bottom:8px}
.pr-ep-durum div{flex:1;display:grid}.pr-ep-durum span{color:var(--muted);font-size:12.5px}
.pr-ep-durum.ok{background:var(--ok-soft)}.pr-ep-durum.ok>.ic{color:var(--ok)}
.pr-sunucu{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.pr-girisler{display:grid;gap:3px;font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.ep-kimden{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--warn-soft);font-size:13px}.ep-kimden span{flex:1}
.ep-kimden.ok{background:var(--ok-soft)}.ep-kimden.ok>.ic{color:var(--ok)}
</style>
</head>

  </div>

</div>

    const parca=String(d.metin||'').split(',').map(x=>x.trim()).filter(Boolean);
    if(parca.length<2){ d.metin=parca[0]||d.metin; d.renk=d.renk||palet[0]; return; }
    d.metin=parca[0]; d.renk=d.renk||palet[0];
    parca.slice(1).forEach((ad,i)=>ekEtiket.push({...d, id:d.id+'-e'+i, metin:ad, renk:palet[(i+1)%palet.length]}));
  });
  s.degerler.push(...ekEtiket);
  // açan / güncelleyen: kayıtta yoksa logdan türet
  const kisiId=ad=>(s.kullanicilar.find(u=>u.ad===ad)||{}).id||ad;
  const denet=(o,f)=>{
    if(o.olusturma) return;
    const L=s.log.filter(f);
    const ilk=L[0], son=L[L.length-1];
    o.olusturan=o.yazarId||(ilk?kisiId(ilk.kisi):'');
    o.olusturma=ilk?ilk.zaman:'';
    o.guncelleyen=son?kisiId(son.kisi):o.olusturan; o.guncelleme=son?son.zaman:o.olusturma;
  };
  s.kartlar.forEach(k=>denet(k, l=>l.kartId===k.id));
  s.projeler.forEach(p=>denet(p, l=>l.projeId===p.id&&!l.kartId));
  s.log.forEach(l=>{ if(!l.tip) l.tip=/açıldı/.test(l.metin)?'yeni':/^Durum:/.test(l.metin)?'durum':/silindi/.test(l.metin)?'sil':'alan'; });
  if(!s.panolar.length) s.panolar=varsayilanPanolar();
  if(!s.kullanicilar.some(u=>u.id==='u0'||u.eposta==='admin@iq-sense.com.tr')) s.kullanicilar.push(JSON.parse(JSON.stringify(SISTEM_ADMIN)));
  if(!s.departmanlar.length) s.departmanlar=DEPARTMAN.slice();
  const grDep={'g-yon':'Yönetim','g-satis':'Satış','g-muh':'Muhasebe','g-saha':'Üretim'};
  s.kullanicilar.forEach(u=>{ if(u.departman==null) u.departman=grDep[u.grup]||''; });
  if(!s.kiosklar.length && !s.kioskKuruldu) s.kiosklar=varsayilanKiosklar();
  s.kioskKuruldu=true;
  if(!s.ciktilar.length && !s.ciktiKuruldu) s.ciktilar=varsayilanCiktilar();
  if(!s.ciktiSurum2){ varsayilanCiktilar().forEach(F=>{ if(!s.ciktilar.some(x=>x.id===F.id)) s.ciktilar.push(F); }); s.ciktiSurum2=true; }
  s.ciktiKuruldu=true;
  s.ciktilar.forEach(F=>{ F.ekSorgular=(F.ekSorgular||[]).map(q=>Object.assign({ust:'',ustAlan:'',bagAlan:'',tarihAlan:'',sirala:'',kosullar:[],alanlar:[],satir:'kayit'},q)); if(F.kisi==='sec') F.kisi='tum'; F.kosullar=F.kosullar||[]; F.alanlar=F.alanlar||[]; F.satir=F.satir||'kayit'; F.kapsam=F.kapsam||'liste'; });
  s.kiosklar.forEach(k=>{ k.sayfalar=Array.isArray(k.sayfalar)?k.sayfalar:[]; k.anahtar=k.anahtar||anahtarUret(); if(!k.ses) k.ses='olay'; });
  rehberEkle(s);
  s.sema=2;
  return s;
}

function metinAra(parca){
  const ks=nrm(ui.q).split(/\s+/).filter(Boolean); if(!ks.length) return true;
  const t=nrm(parca.filter(Boolean).join(' '));
  return ks.every(k=>t.includes(k));
}
function tarihleri(pred){
  const out=[];
  S.degerler.filter(pred).forEach(d=>{ if(d.fnTip==='sure'||d.fnTip==='dokuman') return; if(d.tarih) out.push(d.tarih); if(d.vade) out.push(d.vade); });
  return out;
}
function planVar(isoList, mod){ return isoList.some(v=>tarihUygun(v, mod)); }
function benimProje(p){ const u=ben(); return yoneticiler(p).some(x=>x.id===u.id) || (p.ekip||[]).includes(u.id); }
function atanmis(k){ const u=ben(); return S.degerler.some(d=>d.kartId===k.id && ['kisi','ekip','karar'].includes(d.fnTip) && (d.kisi===u.ad || d.kisi===u.id)); }
function benimKart(k){
  const u=ben(), p=proje(k.projeId);
  if(k.yazarId===u.id) return true;
  if(p && benimProje(p)) return true;
  return atanmis(k);
}
function gorProjeler(){
  return projelerA().filter(p=>{
    if(p.arsiv && !ui.arsiv) return false;
    if(ui.proje && p.id!==ui.proje) return false;
    if(ui.durum && p.durumId!==ui.durum) return false;
    if(ui.ekip && !(p.ekip||[]).includes(ui.ekip)) return false;
    if(ui.benim && !benimProje(p)) return false;
    if(ui.plan && !planVar(tarihleri(d=>d.projeId===p.id), ui.plan)) return false;
    if(ui.q){
      const parca=[p.ad,p.kod,p.kategori,...yoneticiler(p).map(u=>u.ad)];
      S.degerler.filter(d=>d.projeId===p.id).forEach(d=>{ const f=fnBul(d.fnUid); if(f&&!fnGorunur(f)) return; parca.push(d.metin,d.not,d.firma,d.kisi,d.tur,d.yer,d.dosya,ozet(d)); });
      if(!metinAra(parca)) return false;
    }
    return true;
  });
}
function gorKartlar(mid){
  const m=modul(mid||ui.modulId); if(!m) return [];
  return kartlarA().filter(k=>{
    if(k.modulId!==m.id) return false;
    const p=proje(k.projeId); if(!p||p.silindi) return false;
    if(p.arsiv && !ui.arsiv) return false;
    if(ui.proje && k.projeId!==ui.proje) return false;
    if(ui.durum && k.durumId!==ui.durum) return false;
    if(ui.ekip && !((p.ekip||[]).includes(ui.ekip) || S.degerler.some(d=>d.kartId===k.id && d.fnTip==='ekip' && d.kisi===ui.ekip))) return false;
    if(ui.benim && !benimKart(k)) return false;
    if(ui.plan && !planVar([k.tarih, ...tarihleri(d=>d.kartId===k.id)], ui.plan)) return false;
    if(ui.q){
      const parca=[p.ad,p.kod,k.kod];
      S.degerler.filter(d=>d.kartId===k.id).forEach(d=>{ const f=fnBul(d.fnUid); if(f&&!fnGorunur(f)) return; parca.push(ozet(d),d.metin,d.not,d.firma,d.kisi,d.yer,d.dosya); });
      if(!metinAra(parca)) return false;
    }
    return true;
  });
}
function kartBaslik(k){
  const ds=S.degerler.filter(d=>d.kartId===k.id);
  const light=ds.find(d=>d.fnTip==='light'&&d.metin);
  if(light) return light.metin;
  const ac=ds.find(d=>d.fnTip==='aciklama'&&d.metin);
  if(ac) return ac.metin.slice(0,80);
  const mal=ds.find(d=>d.fnTip==='mali'&&d.metin);
  if(mal) return mal.metin;
  const doc=ds.find(d=>d.fnTip==='dokuman'&&(d.dosya||d.metin));
  if(doc) return doc.dosya||doc.metin;
  return k.kod||'Kayıt';
}

  const d=S.degerler.find(x=>x.kartId===k.id && x.fnTip==='kisi' && x.kisi && (m.fn||[]).some(f=>f.uid===x.fnUid && gosterK(m,f.uid)));

function hucreKarsilastir(a,b){
  const x=String(a??'').trim(), y=String(b??'').trim();
  const tarih=/^(\d{2})\.(\d{2})\.(\d{4})/;
  const tx=x.match(tarih), ty=y.match(tarih);
  if(tx&&ty) return (tx[3]+tx[2]+tx[1]+x.slice(10)).localeCompare(ty[3]+ty[2]+ty[1]+y.slice(10));
  const sayi=/^-?\d{1,3}(\.\d{3})*(,\d+)?$|^-?\d+(,\d+)?$/;
  if(sayi.test(x)&&sayi.test(y)) return sayiOku(x)-sayiOku(y);
  return x.localeCompare(y,'tr',{numeric:true,sensitivity:'base'});
}

function yerAyir(d){

/* ---------- dosya yönetimi ---------- */
function dokTur(ad){
  const uz=(String(ad||'').split('.').pop()||'').toLowerCase();
  const L=[['PDF','pdf','#d93025'],['Word','doc docx odt rtf','#2b579a'],['Excel','xls xlsx csv ods','#1e7145'],['Sunum','ppt pptx','#c43e1c'],['Görsel','png jpg jpeg gif webp svg','#8e44ad'],['CAD','dwg dxf step stp','#0e7490'],['Arşiv','zip rar 7z','#6b7280'],['Metin','txt md json','#6b7280']];
  const t=L.find(x=>x[1].split(' ').includes(uz));
  return {ad:t?t[0]:'Dosya', c:t?t[2]:'#6b7280', uz:String(ad||'').includes('.')?uz:''};
}
function depoTani(url){
  const u=String(url||'');
  if(/drive\.google\.com|docs\.google\.com/i.test(u)) return 'gdrive';
  if(/onedrive\.live\.com|1drv\.ms|sharepoint\.com/i.test(u)) return 'onedrive';
  return u&&!u.startsWith('data:')?'link':'yerel';
}

function nasYol(r){ const n=nasAyar(); const p=proje(r.projeId||ui.form?.projeId||(ui.form?.tur==='proje'?ui.form.id:''))||{}; const m=modul(r.modulId||ui.form?.modulId||'ana')||{}; return (n.yol||'').replace(/\\+$/,'')+'\\'+(n.klasor||'').replace('{proje}',p.kod||'genel').replace('{modul}',m.onek||m.ad||'')+'\\'+(r.dosya||''); }
