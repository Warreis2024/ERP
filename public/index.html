function apiPersist(){ clearTimeout(API.zamanlayici); API.zamanlayici=setTimeout(()=>{ API.kuyruk=API.kuyruk.then(esitle); }, 250); }
function kayitGovde(tur, o){
  const D=S.degerler.filter(d=>tur==='proje'?(d.projeId===o.id&&!d.kartId):d.kartId===o.id).map(d=>({...d, zaman:isoZaman(d.zaman)}));
  return tur==='proje'
    ? {id:o.id, ad:o.ad, durumId:o.durumId, kategori:o.kategori||null, arsiv:!!o.arsiv, yonetici:o.yonetici||[], ekip:o.ekip||[], degerler:D}
    : {id:o.id, modulId:o.modulId, projeId:o.projeId, durumId:o.durumId, degerler:D};
}
// kaydedilen kaydı sunucudaki haliyle değiştir (kod, değer kimlikleri, log sunucuda üretilir)
async function kayitTazele(tur, id){
  const v=await apiIstek((tur==='proje'?'/projeler/':'/kartlar/')+encodeURIComponent(id));
  const o=tur==='proje'?v.proje:v.kart;
  o.olusturma=yerelZaman(o.olusturma); o.guncelleme=yerelZaman(o.guncelleme); if(tur==='kart') o.yazarId=o.olusturan;
  v.degerler.forEach(d=>{ d.zaman=yerelZaman(d.zaman); }); v.log.forEach(l=>{ l.zaman=yerelZaman(l.zaman); });
  const L=tur==='proje'?S.projeler:S.kartlar, i=L.findIndex(x=>x.id===id);
  if(i>=0) L[i]=Object.assign(L[i], o); else L.push(o);
  S.degerler=S.degerler.filter(d=>tur==='proje'?!(d.projeId===id&&!d.kartId):d.kartId!==id).concat(v.degerler);
  S.log=S.log.filter(l=>tur==='proje'?!(l.projeId===id&&!l.kartId):l.kartId!==id).concat(v.log);
}
function modulOf(tur, o){ return tur==='proje'?(S.moduller.find(m=>m.tur==='proje')||{}).id:o.modulId; }
async function esitle(){
  if(!API.acik||!API.ben||!S||API.yukleniyor||KS) return; // kiosk salt okunur: açıkken sunucuya hiçbir şey yazılmaz
  const simdiki=iz(S), son=API.son, yon=ben().rol==='yonetici';
  let degisti=false;
  const adim=async(is)=>{ await is(); degisti=true; };
  // güvenlik: tek seferde çok sayıda kayıt siliniyorsa (hatalı bir toplu işlem olabilir) onay iste
  const silSay=['proje','kart'].reduce((n,t)=>n+Object.keys(son[t]).filter(id=>!(id in simdiki[t])).length,0);
  if(silSay>5&&!confirm(silSay+' kayıt sunucudan silinecek. Devam edilsin mi?')){
    API.yukleniyor=true; try{ await durumYukle(); }finally{ API.yukleniyor=false; } render(); return;
  }
  try{
    // 1) tanımlar (yönetici) ve rehber/malzeme (herkes, yalnız ekleme): önce ekle/güncelle, silme en sonda
    const silinecekAyar=[];
    for(const A of AYAR_TABLO){
      if(!yon&&!A.herkes) continue;
      const a=son.ayar[A.t]||{}, b=simdiki.ayar[A.t]||{};
      for(const k of Object.keys(b)){
        if(a[k]===b[k]) continue;
        const r=JSON.parse(b[k]);
        if(!(k in a)) await adim(()=>apiIstek('/ayar/'+A.t, {method:'POST', govde:r}));
        else if(yon) await adim(()=>apiIstek('/ayar/'+A.t+'/'+encodeURIComponent(k), {method:'PUT', govde:r}));
      }
      if(yon) Object.keys(a).filter(k=>!(k in b)).forEach(k=>silinecekAyar.unshift([A.t,k]));
    }
    if(yon&&son.firma!==simdiki.firma) await adim(()=>apiIstek('/ayar/firma', {method:'PUT', govde:JSON.parse(simdiki.firma)}));
    // 2) kullanıcılar (yönetici)
    if(yon){
      for(const id of Object.keys(simdiki.kul)){
        const u=S.kullanicilar.find(x=>x.id===id);
        if(!(id in son.kul)){
          const v=await apiIstek('/ayar/kullanicilar', {method:'POST', govde:{id, ...KUL_ALAN(u)}});
          u.sifre=null; degisti=true;
          geciciSifreGoster(u, v.geciciSifre);
        } else if(son.kul[id]!==simdiki.kul[id]) await adim(()=>apiIstek('/ayar/kullanicilar/'+encodeURIComponent(id), {method:'PUT', govde:KUL_ALAN(u)}));
        if(son.kulY[id]!==simdiki.kulY[id]&&!u.sistem) await adim(()=>apiIstek('/ayar/kullanicilar/'+encodeURIComponent(id)+'/yetkiler', {method:'PUT', govde:KUL_YETKI(u)}));
        // Şifre yalnız yöneticinin "Şifreyi sıfırla" düğmesiyle sıfırlanır; veri değişiminden çıkarım yapılmaz.
        if(u.sifreSifirla&&id in son.kul){
          delete u.sifreSifirla;
          const v=await apiIstek('/ayar/kullanicilar/'+encodeURIComponent(id)+'/sifre-sifirla', {method:'POST', govde:{}});
          degisti=true; geciciSifreGoster(u, v.geciciSifre);
        }
      }
    }
    // 3) kendi profilim ve e-posta hesabım
    if(son.profil!==simdiki.profil&&simdiki.profil) await adim(()=>apiIstek('/oturum/profil', {method:'PUT', govde:JSON.parse(simdiki.profil)}));
    if(son.eposta!==simdiki.eposta&&simdiki.eposta) await adim(()=>apiIstek('/oturum/eposta-hesap', {method:'PUT', govde:JSON.parse(simdiki.eposta)}));
    // 4) projeler, sonra kayıtlar; silmeler ters sırada
    for(const tur of ['proje','kart']){
      const a=son[tur], b=simdiki[tur], L=tur==='proje'?S.projeler:S.kartlar, yol=tur==='proje'?'/projeler':'/kartlar';
      for(const id of Object.keys(b)){
        if(a[id]===b[id]) continue;
        const o=L.find(x=>x.id===id);
        if(!yazabilir(modulOf(tur,o))) continue; // okuyucunun yerel değişikliği (ör. okundu işareti) gönderilmez
        if(id in a) await apiIstek(yol+'/'+encodeURIComponent(id), {method:'PUT', govde:kayitGovde(tur,o)});
        else await apiIstek(yol, {method:'POST', govde:kayitGovde(tur,o)});
        await kayitTazele(tur, id); degisti=true;
      }
    }
    for(const tur of ['kart','proje']){
      const a=son[tur], b=simdiki[tur], yol=tur==='proje'?'/projeler':'/kartlar';
      for(const id of Object.keys(a).filter(id=>!(id in b))){
        await apiIstek(yol+'/'+encodeURIComponent(id), {method:'DELETE'}).catch(e=>{ if(e.durum!==404) throw e; });
        const L=tur==='proje'?S.projeler:S.kartlar, o=L.find(x=>x.id===id); if(o) L.splice(L.indexOf(o),1);
        degisti=true;
      }
    }
    for(const [t,k] of silinecekAyar) await adim(()=>apiIstek('/ayar/'+t+'/'+encodeURIComponent(k), {method:'DELETE'}));
    API.son=iz(S);
    if(degisti) render();
  }catch(e){
    toast(e.message+' — değişiklik geri alındı');
    if(e.durum===401){ API.ben=null; girisGoster('Oturumun kapanmış. Tekrar giriş yap.'); return; }
    try{ API.yukleniyor=true; await durumYukle(); }catch(e2){} finally{ API.yukleniyor=false; }
    render();
  }
}

}

    catch(e){ API.eskiSifre=''; toast(e.message); throw e; }

      case 'kiosk-kopyala': { const k=S.kiosklar.find(x=>x.id===b.dataset.id); if(!k) return; const u=kioskUrl(k); (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Bağlantı kopyalandı'),()=>{ const i=b.parentElement.querySelector('input'); i.select(); toast('Bağlantıyı seçtim, Ctrl+C ile kopyala'); }); return; }
      case 'kiosk-anahtar': { const k=S.kiosklar.find(x=>x.id===b.dataset.id); if(!k||!confirm('Yeni anahtar üretilsin mi? Açık ekranlardaki eski bağlantı çalışmaz.')) return; k.anahtar=anahtarUret(); persist(); render(); toast('Yeni bağlantı hazır'); return; }
      case 'ks-ekle': { const k=S.kiosklar.find(x=>x.id===b.dataset.id); const tip=$('#ksTipSec')?.value; if(!k||!tip) return; const ek=tip==='galeri'?{baslik:'Referanslarımız',alt:''}:tip==='kullanim'?{gun:30,adet:3,goster:'ikisi'}:tip==='geri'?{kaynak:'proje',yesil:14,sari:7,adet:8}:tip==='ekip'?{modul:'is'}:tip==='durgun'?{gun:10}:tip==='proje'?{adet:7}:tip==='mesaj'?{adet:6}:{}; k.sayfalar.push(ksYeni(tip,ek)); persist(); render(); return; }
      case 'ks-sil': { const [kid,uid]=b.dataset.id.split(':'); const k=S.kiosklar.find(x=>x.id===kid); if(!k) return; k.sayfalar=k.sayfalar.filter(x=>x.uid!==uid); ui.cekmece={tur:'kiosk', id:kid}; persist(); render(); return; }
      case 'dep-ekle': { const i=$('#depYeni'); const v=(i?.value||'').trim(); if(!v) return toast('Departman adı yaz'); if(S.departmanlar.some(d=>nrm(d)===nrm(v))) return toast('Bu departman var'); S.departmanlar.push(v); persist(); render(); return; }
      case 'dep-sil': { const v=b.dataset.v; const n=S.kullanicilar.filter(u=>u.departman===v).length; if(n&&!confirm(n+' kullanıcı bu departmanda. Kaldırılırsa departmansız kalırlar. Devam?')) return; S.departmanlar=S.departmanlar.filter(d=>d!==v); S.kullanicilar.forEach(u=>{ if(u.departman===v) u.departman=''; }); S.kiosklar.forEach(k=>{ if(k.departman===v) k.departman=''; }); persist(); render(); return; }
      case 'pano-ekle': { const p={id:nid('pn'), ad:'Yeni pano', ikon:'pano', acik:true, sira:S.panolar.length, bilesen:[]}; S.panolar.push(p); ui.cekmece={tur:'pano', id:p.id, pano:p.id}; persist(); render(); return; }
      case 'pano-sil': { if(!confirm('Pano silinsin mi? (Kayıtlar etkilenmez)')) return; S.panolar=S.panolar.filter(x=>x.id!==b.dataset.id); ui.cekmece=null; if(ui.panoId===b.dataset.id) ui.panoId=''; persist(); render(); return; }
      case 'bl-ekle': {
        const p=S.panolar.find(x=>x.id===b.dataset.id); const tip=$('#blTipSec')?.value; if(!p||!tip) return;
        p.bilesen=p.bilesen||[]; p.bilesen.push({uid:nid('bl'), tip, ad:BLAD[tip], genis:['ozet','teslim','butce','dagilim'].includes(tip)?'tam':'yarim'});
        persist(); render(); return;
      }
      case 'bl-sil': {
        const [pid,uid]=b.dataset.id.split(':'); const p=S.panolar.find(x=>x.id===pid); if(!p) return;
        p.bilesen=p.bilesen.filter(x=>x.uid!==uid); ui.cekmece={tur:'pano', id:pid, pano:pid}; persist(); render(); return;
      }
      case 'migrasyon': if(API.acik) return toast('Sunucu modunda bu işlem yapılamaz'); migrasyonHepsine(); return;
      case 'firma-ekle': { if(API.acik) return toast('Sunucu modunda bu işlem yapılamaz');
        const sub=(prompt('Alt alan adı','alfa')||'').toLowerCase().replace(/[^a-z0-9-]/g,'');
        if(!sub) return;
        if(localStorage.getItem(anahtar(sub))) return toast('Bu firma var');
        const ad=prompt('Firma adı', sub)||sub;
        localStorage.setItem(anahtar(sub), JSON.stringify(kurulum(ad, sub, false)));
        acFirma(sub); return;
      }
      case 'sifirla': { if(API.acik) return toast('Sunucu modunda bu işlem yapılamaz');
        if(!confirm('Bu firmanın verisi silinip örnek kurulum yüklensin mi?')) return;
        const {ad, sub}=S.firma;
        S=kurulum(ad, sub, true); persist(); ui.form=null; ui.cekmece=null; render(); toast('Örnek veri yüklendi'); return;
      }
    }
  });
  app.addEventListener('dragstart', e=>{
    const cp=e.target.closest&&e.target.closest('.ck-cip');
    if(cp){ e.dataTransfer.setData('text/plain','{{'+(cp.dataset.on?cp.dataset.on+'.':'')+cp.dataset.v+'}}'); e.dataTransfer.effectAllowed='copy'; return; }
    const s=e.target.closest('[data-sirala]');
    if(s && s.getAttribute('draggable')==='true'){
      e.dataTransfer.setData('text/plain', 's:'+s.dataset.sirala+':'+s.dataset.id);
      e.dataTransfer.effectAllowed='move'; ui.suruk=true; return;
    }
    const c=e.target.closest('[data-kart],[data-proje]');
    if(!c||c.getAttribute('draggable')!=='true') return;
    e.dataTransfer.setData('text/plain', c.dataset.kart?('k:'+c.dataset.kart):('p:'+c.dataset.proje));
    e.dataTransfer.effectAllowed='move'; ui.suruk=true;
  });
  app.addEventListener('dragend', ()=>{ setTimeout(()=>{ ui.suruk=false; }, 50); });
  app.addEventListener('dragover', e=>{
    const bz=e.target.closest('[data-birak]');
    if(bz){ e.preventDefault(); bz.classList.add('over'); return; }
    const s=e.target.closest('[data-sirala]');
    const kol=e.target.closest('[data-kolon]');
    if(s){ e.preventDefault(); s.classList.add('over'); return; }
    if(kol){ e.preventDefault(); kol.classList.add('over'); }
  });
  app.addEventListener('dragleave', e=>{
    const el=e.target.closest('[data-sirala],[data-kolon],[data-birak]');
    if(el && !el.contains(e.relatedTarget)) el.classList.remove('over');
  });
  app.addEventListener('drop', e=>{
    document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
    const bz=e.target.closest('[data-birak]');
    if(bz){ e.preventDefault(); if(e.dataTransfer.files.length){ formDomOku(); const f=fnBul(bz.dataset.birak); if(f) dosyaEkle(f, e.dataTransfer.files); } return; }
    const hedef=e.target.closest('[data-sirala]');
    if(hedef){
      e.preventDefault();
      const p=e.dataTransfer.getData('text/plain').split(':');
      if(p[0]==='s' && p[1]===hedef.dataset.sirala) siralaBirak(p[1], p.slice(2).join(':'), hedef.dataset.id);
      return;
    }
    const kol=e.target.closest('[data-kolon]'); if(!kol) return;
    e.preventDefault();
    const [tip,id]=e.dataTransfer.getData('text/plain').split(':');
    tasi(tip, id, kol.dataset.kolon);
  });
  document.addEventListener('keydown', e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&e.target.dataset&&e.target.dataset.mesajYaz){ e.preventDefault(); mesajGonder(e.target.dataset.mesajYaz); return; }
    if(e.key==='Escape'&&ui.onizle){ ui.onizle=null; renderOnizle(); e.stopImmediatePropagation(); return; }
    if(e.key==='Escape'&&ui.emoji){ ui.emoji=null; renderDrawer(); e.stopImmediatePropagation(); return; }
  });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape'&&(ui.form||ui.cekmece||ui.eposta)){ if(ui.eposta){ ui.eposta=null; renderDrawer(); return; } ui.form=null; ui.cekmece=null; render(); } });
}

(async function init(){
  const tema=localStorage.getItem('yerp-tema'); if(tema) document.documentElement.dataset.theme=tema;
  bagla(); kioskOlay(); girisOlay();
  const kh=kioskHash();
  // Sunucudan açıldıysa (API cevap veriyorsa) veri sunucuda; değilse tarayıcıdaki örnek veriyle çalışılır.
  if(!kh && await apiBaslat()) return;
  if(!localStorage.getItem(anahtar('yontem'))) yukle('yontem');
  if(!localStorage.getItem(anahtar('alfa'))) yukle('alfa');
  if(kh) kioskBaslat(kh); else acFirma(localStorage.getItem('yerp-firma')||'yontem');
})();
</script>
